<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartTransport · Кратко</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style id="leaflet-css">/*@@LEAFLET_CSS@@*/
</style>
<style>
/* Layout: icon rail · top status bar · live map stage · event/route side panel; decisions open as a drawer over the map edge */
:root{
  --f-ui:"Onest","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;

  --bg:#ECEEF3; --surface:#FFFFFF; --surface-2:#F5F6F9; --surface-3:#EBEDF2;
  --line:#E0E3EA; --line-strong:#CBD0DA;
  --text:#11141C; --text-2:#4F5768; --text-3:#858C9C;
  --brand:#6A4CF0; --brand-ink:#FFFFFF; --brand-soft:rgba(106,76,240,.10); --brand-line:rgba(106,76,240,.38);
  --ok:#17905A; --ok-dot:#22B36C; --ok-soft:rgba(34,179,108,.12);
  --warn:#A87400; --warn-dot:#F0B323; --warn-soft:rgba(240,179,35,.17);
  --late:#C9560A; --late-dot:#F07A26; --late-soft:rgba(240,122,38,.14);
  --crit:#D42A36; --crit-dot:#E5323F; --crit-soft:rgba(229,50,63,.09); --crit-line:rgba(229,50,63,.35);
  --shadow:0 1px 2px rgba(17,20,28,.05),0 10px 28px -6px rgba(17,20,28,.14);
  --shadow-s:0 1px 2px rgba(17,20,28,.06),0 2px 8px rgba(17,20,28,.06);
  --overlay:rgba(236,238,243,.82);

  --m-land:#E8EAEE; --m-urban:#E1E4E9; --m-water:#C6D5E5; --m-park:#D8E4D3; --m-meadow:#E2EADB;
  --m-road:#FFFFFF; --m-case:#D0D4DC; --m-minor:#F3F4F7; --m-rail:#B4BAC6; --m-label:#8A91A1;
  --m-route:#8F98AC; --m-stop:#FFFFFF; --m-route-y:#4F586B;
  --ym21-filter:none; --ym21-filter-min:saturate(.2) contrast(.9) brightness(1.04); --ym21-veil:.42;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0C11; --surface:#12151C; --surface-2:#181B24; --surface-3:#1F232D;
    --line:#232833; --line-strong:#313744;
    --text:#E5E7ED; --text-2:#9BA2B2; --text-3:#646B7B;
    --brand:#8C76FF; --brand-ink:#FFFFFF; --brand-soft:rgba(140,118,255,.14); --brand-line:rgba(140,118,255,.45);
    --ok:#46D08A; --ok-dot:#3CC77F; --ok-soft:rgba(60,199,127,.13);
    --warn:#F3C454; --warn-dot:#F3C454; --warn-soft:rgba(243,196,84,.14);
    --late:#FF934D; --late-dot:#FF8A3D; --late-soft:rgba(255,138,61,.14);
    --crit:#FF5C66; --crit-dot:#FF4D58; --crit-soft:rgba(255,77,88,.12); --crit-line:rgba(255,77,88,.45);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -8px rgba(0,0,0,.6);
    --shadow-s:0 1px 2px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.3);
    --overlay:rgba(10,12,17,.84);
    --m-land:#0F1218; --m-urban:#13171E; --m-water:#152030; --m-park:#111A16; --m-meadow:#111815;
    --m-road:#242935; --m-case:#0B0D12; --m-minor:#181C24; --m-rail:#2A2F3B; --m-label:#566072;
    --m-route:#4C5569; --m-stop:#12151C; --m-route-y:#9AA3B8;
    --ym21-filter:invert(1) hue-rotate(180deg) saturate(.5) brightness(.85) contrast(.9); --ym21-filter-min:invert(1) hue-rotate(180deg) saturate(.15) brightness(.75) contrast(.85); --ym21-veil:.45;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0C11; --surface:#12151C; --surface-2:#181B24; --surface-3:#1F232D;
  --line:#232833; --line-strong:#313744;
  --text:#E5E7ED; --text-2:#9BA2B2; --text-3:#646B7B;
  --brand:#8C76FF; --brand-ink:#FFFFFF; --brand-soft:rgba(140,118,255,.14); --brand-line:rgba(140,118,255,.45);
  --ok:#46D08A; --ok-dot:#3CC77F; --ok-soft:rgba(60,199,127,.13);
  --warn:#F3C454; --warn-dot:#F3C454; --warn-soft:rgba(243,196,84,.14);
  --late:#FF934D; --late-dot:#FF8A3D; --late-soft:rgba(255,138,61,.14);
  --crit:#FF5C66; --crit-dot:#FF4D58; --crit-soft:rgba(255,77,88,.12); --crit-line:rgba(255,77,88,.45);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -8px rgba(0,0,0,.6);
  --shadow-s:0 1px 2px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.3);
  --overlay:rgba(10,12,17,.84);
  --m-land:#0F1218; --m-urban:#13171E; --m-water:#152030; --m-park:#111A16; --m-meadow:#111815;
  --m-road:#242935; --m-case:#0B0D12; --m-minor:#181C24; --m-rail:#2A2F3B; --m-label:#566072;
  --m-route:#4C5569; --m-stop:#12151C; --m-route-y:#9AA3B8;
  --ym21-filter:invert(1) hue-rotate(180deg) saturate(.5) brightness(.85) contrast(.9); --ym21-filter-min:invert(1) hue-rotate(180deg) saturate(.15) brightness(.75) contrast(.85); --ym21-veil:.45;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ic{width:18px;height:18px;flex:none;display:block}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{--drawer-w:600px;--side-w:392px;display:grid;grid-template-columns:68px minmax(0,1fr) var(--side-w);grid-template-rows:60px minmax(0,1fr);height:100%;position:relative}
.rail{grid-row:1/3;grid-column:1;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0 14px;z-index:1100}
.logo{width:40px;height:40px;margin-bottom:14px}
.rail-btn{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--text-3);transition:background .15s,color .15s}
.rail-btn:hover{background:var(--surface-2);color:var(--text)}
.rail-btn.is-active{background:var(--brand-soft);color:var(--brand)}
.rail-btn .ic{width:20px;height:20px}
.rail-btn .dot{position:absolute;top:7px;right:7px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--crit-dot);color:#fff;font:700 10px/16px var(--f-num);text-align:center;box-shadow:0 0 0 2px var(--surface)}
.rail-btn .tip{z-index:2;box-shadow:var(--shadow-s);position:absolute;left:54px;top:50%;transform:translateY(-50%);background:var(--text);color:var(--surface);font-size:12px;font-weight:500;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.rail-btn:hover .tip{opacity:1}
.rail-spacer{flex:1}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:grid;place-items:center;font-weight:600;font-size:13px;margin-top:6px}

.topbar{grid-column:2/4;grid-row:1;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:0 20px 0 24px;min-width:0;z-index:4}
.tb-title{display:flex;flex-direction:column;min-width:0}
.tb-title h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.tb-title p{margin:0;font-size:12px;color:var(--text-3);white-space:nowrap}
.kpis{display:flex;align-items:stretch;gap:0;min-width:0}
.kpi{display:flex;flex-direction:column;justify-content:center;padding:0 20px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0;padding-left:0}
.kpi-l{font-size:11px;color:var(--text-3);letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:6px}
.kpi-v{font:600 18px/1.2 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-v small{font-size:12px;color:var(--text-3);font-weight:500}
.kpi.is-crit .kpi-v{color:var(--crit)}
.kpi.is-crit{animation:kpiPulse 1.6s ease-in-out infinite}
@keyframes kpiPulse{50%{opacity:.55}}
.sdot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.sdot.ok{background:var(--ok-dot)}.sdot.warn{background:var(--warn-dot)}.sdot.late{background:var(--late-dot)}.sdot.crit{background:var(--crit-dot)}.sdot.brand{background:var(--brand)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.search{display:flex;align-items:center;gap:8px;height:36px;width:280px;padding:0 10px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--text-3)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;font-size:13px;color:var(--text)}
.search input::placeholder{color:var(--text-3)}
.kbd{font:600 11px/1 var(--f-num);color:var(--text-3);border:1px solid var(--line-strong);border-radius:5px;padding:3px 5px;background:var(--surface)}
.clock{text-align:right;line-height:1.15}
.clock b{display:block;font:600 18px/1.2 var(--f-num);font-variant-numeric:tabular-nums}
.clock span{font-size:11px;color:var(--text-3)}

/* ---------- map stage ---------- */
.stage{grid-column:2;grid-row:2;position:relative;min-width:0;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;background:var(--m-land)}
.leaflet-container{font-family:var(--f-ui);background:var(--m-land)}
.leaflet-container a{color:var(--brand)}
.overlay-tl{position:absolute;top:16px;left:16px;z-index:500;display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-s);font-size:12.5px;font-weight:500;color:var(--text-2)}
.chipbtn .ic{width:15px;height:15px}
.chipbtn[aria-pressed="true"]{color:var(--text);border-color:var(--line-strong)}
.chipbtn[aria-pressed="false"]{opacity:.6}
.chipbtn:hover{color:var(--text)}
.chipbtn.route-filter{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand)}
.overlay-tr{position:absolute;top:16px;right:16px;z-index:500;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.mapctl{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-s);overflow:hidden}
.mapctl button{width:32px;height:32px;display:grid;place-items:center;color:var(--text-2)}
.mapctl button+button{border-top:1px solid var(--line)}
.mapctl .ic{width:16px;height:16px}
.mapctl button:hover{background:var(--surface-2);color:var(--text)}
.basemap-sw{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-s);padding:3px;gap:2px}
.basemap-sw button{font-size:11.5px;font-weight:500;padding:5px 8px;border-radius:7px;color:var(--text-3)}
.basemap-sw button[aria-pressed="true"]{background:var(--surface-3);color:var(--text)}
.basemap-sw button:disabled{opacity:.4;cursor:not-allowed}

.legend{position:absolute;left:16px;bottom:16px;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-s);padding:12px 14px;display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--text-2);min-width:196px}
.legend .lg-h{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:2px}
.legend .li b{margin-left:auto}
.legend .li{display:flex;align-items:center;gap:7px;white-space:nowrap}
.legend .li b{font:600 12px var(--f-num);color:var(--text)}
.legend .res-sw{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--text-2);background:var(--surface)}

/* alert banner over the map */
.alert{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:600;width:min(720px,calc(100% - 32px));display:flex;align-items:center;gap:14px;padding:10px 10px 10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--crit-line);box-shadow:0 0 0 4px var(--crit-soft),var(--shadow);animation:dropIn .35s cubic-bezier(.2,.8,.2,1)}
.alert.is-progress{border-color:var(--brand-line);box-shadow:0 0 0 4px var(--brand-soft),var(--shadow)}
@keyframes dropIn{from{opacity:0;transform:translate(-50%,-12px)}}
.alert-ic{width:38px;height:38px;border-radius:10px;background:var(--crit-dot);color:#fff;display:grid;place-items:center;flex:none;position:relative}
.alert-ic::after{content:"";position:absolute;inset:-4px;border-radius:13px;border:2px solid var(--crit-dot);opacity:0;animation:ring 1.6s ease-out infinite}
.alert.is-progress .alert-ic{background:var(--brand)}
.alert.is-progress .alert-ic::after{display:none}
@keyframes ring{0%{opacity:.7;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
.alert-body{flex:1;min-width:0}
.alert-top{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--crit)}
.alert.is-progress .alert-top{color:var(--brand)}
.alert-top .num{letter-spacing:0;text-transform:none;font-weight:600;color:var(--text-3)}
.alert-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert-sub{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert-actions{display:flex;gap:8px;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,transform .1s,box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn .ic{width:16px;height:16px}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{box-shadow:0 0 0 4px var(--brand-soft)}
.btn-danger{background:var(--crit-dot);color:#fff}
.btn-danger:hover{box-shadow:0 0 0 4px var(--crit-soft)}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--surface-3)}
.btn-lg{height:46px;padding:0 20px;font-size:15px;border-radius:12px}
.btn .kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:inherit}
.btn-ghost .kbd{background:var(--surface);border-color:var(--line-strong);color:var(--text-3)}
.btn[disabled]{opacity:.55;cursor:progress}

/* bus markers */
.bm{width:30px;height:20px;border-radius:7px;display:grid;place-items:center;background:var(--surface);color:var(--text);font:700 11px/1 var(--f-num);border:2px solid var(--ok-dot);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:opacity .25s,transform .2s}
.bm.s-warn{border-color:var(--warn-dot)}
.bm.s-late{border-color:var(--late-dot);background:var(--late-dot);color:#fff}
.bm.s-crit{border-color:var(--crit-dot);background:var(--crit-dot);color:#fff;transform:scale(1.25)}
.bm.s-off{border-color:var(--text-3);background:var(--surface-3);color:var(--text-3);border-style:dashed}
.bm.s-reserve{border-color:var(--text-2);border-radius:5px;background:var(--surface-2);color:var(--text-2);width:34px}
.bm.s-cand{border-color:var(--brand);background:var(--surface);color:var(--brand)}
.bm.s-cand.is-sel{background:var(--brand);color:#fff;transform:scale(1.15)}
.bm.s-moving{border-color:var(--brand);background:var(--brand);color:#fff;transform:scale(1.15)}
.bm:hover{transform:scale(1.15)}
.map-dim .bm:not(.s-crit):not(.s-cand):not(.s-moving):not(.r10){opacity:.28}
.map-dim .bm.r10{opacity:1}
.map-focus .bm:not(.focus){opacity:.22}
.pulse{width:120px;height:120px;position:relative;pointer-events:none}
.pulse i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--crit-dot);background:var(--crit-soft);animation:pulse 2s ease-out infinite;opacity:0}
.pulse i:nth-child(2){animation-delay:.66s}.pulse i:nth-child(3){animation-delay:1.33s}
@keyframes pulse{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1);opacity:0}}
.eta-tag{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:var(--surface);color:var(--text);border:1px solid var(--line-strong);border-radius:8px;padding:3px 7px;font:600 11.5px/1.2 var(--f-num);box-shadow:var(--shadow-s);transform:translate(-50%,-50%);width:max-content}
.eta-tag.is-sel{background:var(--brand);border-color:var(--brand);color:#fff}
.eta-tag.is-off{color:var(--text-3)}
.map-label{color:var(--m-label);font:600 10.5px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;transform:translate(-50%,-50%);width:max-content;pointer-events:none;text-shadow:0 0 3px var(--m-land),0 0 6px var(--m-land)}
.map-label.river{font-style:italic;font-weight:500;letter-spacing:.08em;text-transform:none;font-size:12px;color:var(--m-label)}
#ymap{position:absolute;inset:0;pointer-events:none;background:var(--m-land)}
.stage.on-yandex #map,.stage.on-yandex .leaflet-container{background:transparent}
.stage.on-yandex .legend,.stage.on-yandex .scen{bottom:40px}
.stage.on-yandex .bm{box-shadow:0 0 0 2.5px var(--bg),0 2px 6px rgba(0,0,0,.45)}
.stage.on-yandex .bm.s-ok,.stage.on-yandex .bm.s-warn,.stage.on-yandex .bm.s-reserve{background:var(--surface);border-width:2.5px}
/* промо-блок Яндекса «Открыть в Яндекс Картах / Создать свою карту»; логотип, копирайт и условия остаются */
#ymap [class*="copyrights-promo"],#ymap [class*="map-open-block"]{display:none!important}
/* запасной JS API 2.1: стилизации нет, поэтому «Минимум» — обесцвечивание и вуаль цвета фона, тёмная тема — инверсия */
#ymap::after{content:"";position:absolute;inset:0;background:var(--m-land);opacity:0;pointer-events:none;z-index:1;transition:opacity .2s}
.stage.ym21.ym-min #ymap::after{opacity:var(--ym21-veil)}
.stage.ym21 #ymap [class*="ground-pane"]{filter:var(--ym21-filter)}
.stage.ym21.ym-min #ymap [class*="ground-pane"]{filter:var(--ym21-filter-min)}

/* leaflet popup = bus card */
.leaflet-popup.bus-pop .leaflet-popup-content-wrapper{background:var(--surface);color:var(--text);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);padding:0}
.leaflet-popup.bus-pop .leaflet-popup-content{margin:0;width:268px!important;font:inherit}
.leaflet-popup.bus-pop .leaflet-popup-tip{background:var(--surface);border:1px solid var(--line)}
.leaflet-popup.bus-pop a.leaflet-popup-close-button{color:var(--text-3);top:8px;right:8px}
.bp{padding:14px 16px 14px}
.bp-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bp-h .rb{flex:none}
.bp-h b{font:700 16px var(--f-num)}
.bp-h span{color:var(--text-3);font-size:12px}
.bp dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:12.5px}
.bp dt{color:var(--text-3)}
.bp dd{margin:0;text-align:right;font-weight:500}
.leaflet-tooltip.stop-tip{background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow-s);border-radius:8px;font:500 12px var(--f-ui);padding:4px 8px}
.leaflet-tooltip.stop-tip::before{display:none}
.leaflet-control-attribution{background:var(--surface)!important;color:var(--text-3)!important;font-size:10px!important;border-radius:6px 0 0 0}

/* route badge */
.rb{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:6px;background:var(--surface-3);color:var(--text);font:700 12px/1 var(--f-num)}
.rb.is-crit{background:var(--crit-dot);color:#fff}
.rb.is-brand{background:var(--brand);color:#fff}

/* status chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.late{background:var(--late-soft);color:var(--late)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.mute{background:var(--surface-3);color:var(--text-2)}
.chip .ic{width:13px;height:13px}

/* ---------- side panel ---------- */
.side{grid-column:3;grid-row:2;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:3}
.tabs{display:flex;gap:4px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.tab{position:relative;padding:8px 10px 12px;font-weight:600;font-size:13.5px;color:var(--text-3);display:flex;align-items:center;gap:8px}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--brand)}
.tab .cnt{font:600 11px/18px var(--f-num);min-width:20px;height:18px;padding:0 5px;border-radius:9px;background:var(--surface-3);color:var(--text-2);text-align:center}
.tab .cnt.crit{background:var(--crit-dot);color:#fff}
.panel{flex:1;overflow:auto;min-height:0}
.panel[hidden]{display:none}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.feed{list-style:none;margin:0;padding:0 8px 16px}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:11px 10px;border-radius:12px;align-items:start}
.ev+.ev{border-top:1px solid var(--line);border-radius:0}
.ev .sdot{margin-top:6px}
.ev-t{font-size:13.5px;font-weight:500;line-height:1.35}
.ev-s{grid-column:2/4;font-size:12px;color:var(--text-3);margin-top:1px}
.ev-time{font:500 11.5px var(--f-num);color:var(--text-3);padding-top:2px}
.ev.is-new{animation:evIn .5s ease-out}
@keyframes evIn{from{background:var(--brand-soft)}}
.ev-crit{border:1px solid var(--crit-line)!important;background:var(--crit-soft);border-radius:14px!important;padding:14px;margin:0 0 8px;grid-template-columns:auto 1fr auto}
.ev-crit + .ev{border-top:0}
.ev-crit .ev-t{font-weight:600;font-size:14px}
.ev-crit .ev-s{color:var(--text-2)}
.ev-crit .ev-act{grid-column:1/4;display:flex;gap:8px;margin-top:10px}
.ev-crit .ev-act .btn{flex:1}
.ev-crit .ev-time{color:var(--crit);font-weight:600}
.ev-progress{border:1px solid var(--brand-line)!important;background:var(--brand-soft);border-radius:14px!important;padding:14px;margin:0 0 8px}
.ev-progress + .ev{border-top:0}
.ev-progress .ev-act{grid-column:1/4;margin-top:10px}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .4s linear}

.rlist{list-style:none;margin:0;padding:0 8px 16px}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:11px 10px;border-radius:12px;cursor:pointer}
.rrow:hover{background:var(--surface-2)}
.rrow.is-sel{background:var(--brand-soft)}
.rrow .rn{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rm{grid-column:2/4;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-3)}
.rrow .rm .num{color:var(--text-2)}
.segs{display:flex;gap:2px;margin-left:auto}
.segs i{width:7px;height:10px;border-radius:2px;background:var(--ok-dot)}
.segs i.warn{background:var(--warn-dot)}.segs i.late{background:var(--late-dot)}.segs i.crit{background:var(--crit-dot)}.segs i.off{background:var(--line-strong)}.segs i.brand{background:var(--brand)}
.side-foot{border-top:1px solid var(--line);padding:10px 16px;font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:8px}
.live{width:7px;height:7px;border-radius:50%;background:var(--ok-dot);box-shadow:0 0 0 3px var(--ok-soft);animation:kpiPulse 2s infinite}

/* ---------- decision drawer ---------- */
.drawer{position:absolute;top:84px;right:0;bottom:0;width:var(--drawer-w);max-width:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:-24px 0 48px -24px rgba(0,0,0,.35);z-index:900;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.drawer.is-open{transform:none;visibility:visible}
.dz-head{padding:18px 24px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.dz-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-3)}
.dz-meta .num{color:var(--text-2)}
.dz-head h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.015em;grid-column:1}
.dz-close{grid-row:1/3;grid-column:2;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--text-3);align-self:start}
.dz-close:hover{background:var(--surface-2);color:var(--text)}
.dz-body{flex:1;overflow:auto;padding:20px 24px 28px;display:flex;flex-direction:column;gap:24px;min-height:0}
.dz-sec h3{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);display:flex;align-items:center;justify-content:space-between;gap:8px}
.dz-sec h3 span{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
.broken{border:1px solid var(--crit-line);background:var(--crit-soft);border-radius:16px;padding:16px 18px}
.broken-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.broken-id{font:700 28px/1 var(--f-num);letter-spacing:-.02em}
.broken-top .sub{font-size:12.5px;color:var(--text-2);line-height:1.35}
.broken-top .chip{margin-left:auto}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px}
.kv div{min-width:0}
.kv dt{font-size:11.5px;color:var(--text-3);margin-bottom:2px}
.kv dd{margin:0;font-size:13.5px;font-weight:500}
.kv dd small{display:block;font:500 11.5px var(--f-num);color:var(--text-3)}
.kv .wide{grid-column:1/5}
.broken-act{display:flex;gap:8px;margin-top:14px}
.broken-act .btn{height:34px;font-size:12.5px;background:var(--surface)}

.strip{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface-2)}
.strip>svg{display:block;width:100%;height:auto;overflow:visible}
.iv{margin-top:14px;display:grid;grid-template-columns:76px 1fr;gap:8px 10px;align-items:center;font-size:11.5px;color:var(--text-3)}
.iv-row{display:flex;gap:2px;height:24px}
.iv-row i{display:grid;place-items:center;border-radius:4px;background:var(--surface-3);color:var(--text-2);font:600 11px var(--f-num);font-style:normal;min-width:0;overflow:hidden}
.iv-row i.gap{background:var(--crit-soft);color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit-line)}
.iv-row i.new{background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand-line)}
.impact .ic{width:16px;height:16px;color:var(--text-3)}
.impact{display:flex;align-items:center;gap:16px;margin-top:12px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2)}
.impact b{font-family:var(--f-num);color:var(--text)}

.cands{display:flex;flex-direction:column;gap:8px}
.cand{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.cand:hover{border-color:var(--line-strong)}
.cand input{position:absolute;opacity:0;pointer-events:none}
.cand.is-sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand)}
.cand.is-off{cursor:not-allowed;background:var(--surface-2)}
.cand.is-off .c-id,.cand.is-off .c-eta{color:var(--text-3)}
.c-radio{grid-column:1;grid-row:1/3;width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);margin-top:3px;display:grid;place-items:center}
.cand.is-sel .c-radio{border-color:var(--brand)}
.cand.is-sel .c-radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}
.c-main{grid-column:2;grid-row:1/3;min-width:0;align-self:center}
.c-line1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.c-id{font:700 17px var(--f-num)}
.c-model{font-size:12px;color:var(--text-3)}
.c-place{font-size:12.5px;color:var(--text-2);margin-top:2px}
.c-eta{grid-column:3;grid-row:1/3;text-align:right;align-self:center}
.c-eta b{display:block;font:700 20px/1.1 var(--f-num)}
.c-eta span{font:500 11.5px var(--f-num);color:var(--text-3)}
.c-tags{grid-column:2/4;grid-row:4;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.c-warn{grid-column:2/4;grid-row:3;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--late);margin-top:4px}
.c-warn.off{color:var(--text-3)}
.c-warn .ic{width:14px;height:14px}
.c-key{position:absolute;right:12px;top:-9px;background:var(--surface);padding:0 4px}
.reco{position:absolute;left:16px;top:-10px;background:var(--brand);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:2px 7px}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:center;gap:12px;padding:9px 4px;font-size:13.5px;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--brand);margin:0}
.opt .ic{color:var(--text-3)}
.opt small{color:var(--text-3);font-size:12px;margin-left:auto}
.dz-foot{border-top:1px solid var(--line);padding:14px 24px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface)}
.dz-foot .dz-sum{flex:1 1 100%}
.dz-sum{flex:1;min-width:0;font-size:12.5px;color:var(--text-2);line-height:1.4}
.dz-sum b{color:var(--text);font-weight:600}
.dz-sum .num{color:var(--text)}

.done-hero{display:flex;gap:16px;align-items:center}
.done-ic{width:52px;height:52px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none}
.done-ic .ic{width:26px;height:26px;stroke-width:2.4}
.done-hero h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em;text-transform:none;color:var(--text)}
.done-hero p{margin:2px 0 0;color:var(--text-2);font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.metric span{font-size:11.5px;color:var(--text-3)}
.metric b{display:block;font:700 20px/1.2 var(--f-num);margin-top:2px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:24px 1fr auto;gap:12px;padding:10px 0;position:relative}
.step::before{content:"";position:absolute;left:11px;top:34px;bottom:-4px;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.st-ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--text-3)}
.st-ic .ic{width:14px;height:14px;stroke-width:2.6}
.step.is-done .st-ic{background:var(--ok-dot);color:#fff}
.step.is-run .st-ic{background:var(--brand);color:#fff}
.step.is-run .st-ic .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st-t{font-size:13.5px;font-weight:500}
.st-s{font-size:12px;color:var(--text-3);margin-top:1px}
.st-time{font:500 12px var(--f-num);color:var(--text-3)}
.step .bar{margin-top:8px}

/* ---------- scenario (presentation) ---------- */
.scen{position:absolute;bottom:16px;left:calc(50% + 100px);transform:translateX(-50%);width:max-content;z-index:650;display:flex;align-items:center;gap:6px;padding:6px;border-radius:14px;background:var(--surface);border:1px dashed var(--brand-line);box-shadow:var(--shadow);max-width:calc(100% - 32px);flex-wrap:wrap}
.scen-tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);padding:0 8px 0 6px}
.scen-steps{display:flex;gap:2px}
.scen-step{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;font-size:12px;font-weight:500;color:var(--text-3);white-space:nowrap}
.scen-step i{font:600 10.5px/18px var(--f-num);font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--surface-3);text-align:center;color:var(--text-3)}
.scen-step.is-cur{background:var(--brand-soft);color:var(--brand)}
.scen-step.is-cur i{background:var(--brand);color:#fff}
.scen-step.is-past{color:var(--text-2)}
.scen-step.is-past i{background:var(--ok-dot);color:#fff}
.scen-sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.scen-info{font:500 12px var(--f-num);color:var(--text-2);padding:0 6px;white-space:nowrap;min-width:120px}
.scen .btn{height:32px;font-size:12.5px;padding:0 11px;border-radius:9px}
.scen-min{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--text-3)}
.scen-min:hover{background:var(--surface-2)}
.scen.is-min .scen-steps,.scen.is-min .scen-sep,.scen.is-min .scen-info,.scen.is-min .scen-btns{display:none}
.scen-btns{display:flex;gap:6px}
.app.drawer-open .scen{left:auto;right:calc(var(--drawer-w) - var(--side-w) + 16px);transform:none}
.app.drawer-open .toast{left:35%}

/* ---------- toast ---------- */
.toast{position:absolute;left:50%;bottom:84px;transform:translate(-50%,10px);z-index:1200;background:var(--text);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

/* ---------- UX logic page ---------- */
.ux{position:fixed;inset:0;z-index:2000;background:var(--bg);overflow:auto}
.ux-in{max-width:1180px;margin:0 auto;padding:32px 24px 72px}
.ux-top{display:flex;align-items:center;gap:16px;margin-bottom:36px;position:sticky;top:0;padding:14px 0;background:var(--bg);z-index:2}
.ux-top .logo{margin:0}
.ux-top h2{margin:0;font-size:15px;font-weight:600}
.ux-top p{margin:0;color:var(--text-3);font-size:12px}
.ux-top .btn{margin-left:auto}
.ux-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:end;margin-bottom:48px}
.ux-hero h1{font-size:44px;line-height:1.05;letter-spacing:-.03em;margin:0 0 16px;font-weight:600;text-wrap:balance}
.ux-hero p{font-size:16px;color:var(--text-2);margin:0;max-width:60ch}
.ux-big{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ux-big div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.ux-big b{display:block;font:700 32px/1.1 var(--f-num);letter-spacing:-.03em}
.ux-big span{font-size:12.5px;color:var(--text-3)}
.ux-big .you{color:var(--brand)}
.ux-sec{margin-top:56px}
.ux-sec>h3{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin:0 0 6px}
.ux-sec>h4{font-size:26px;letter-spacing:-.02em;margin:0 0 20px;font-weight:600;text-wrap:balance}
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.fl{padding:18px 18px 20px;border-left:1px solid var(--line);position:relative;min-width:0}
.fl:first-child{border-left:0}
.fl-n{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.fl-n i{font:600 11px/22px var(--f-num);font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--surface-3);text-align:center;color:var(--text-2)}
.fl-n span{font:600 12px var(--f-num);color:var(--text-3)}
.fl b{display:block;font-size:14.5px;margin-bottom:6px}
.fl p{margin:0;font-size:12.5px;color:var(--text-2)}
.fl .act{margin-top:12px;display:inline-flex;font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;background:var(--brand-soft);color:var(--brand)}
.fl.crit i{background:var(--crit-dot);color:#fff}
.fl.click i{background:var(--brand);color:#fff}
.fl.ok i{background:var(--ok-dot);color:#fff}
.timeline{margin-top:14px;display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.timeline i{display:block;height:100%}
.tl-cap{display:flex;justify-content:space-between;font:500 11.5px var(--f-num);color:var(--text-3);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.card h5{margin:0 0 8px;font-size:15px;font-weight:600}
.card p,.card li{font-size:13.5px;color:var(--text-2);margin:0}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.state-demo{border-radius:12px;height:120px;margin-bottom:16px;position:relative;overflow:hidden;background:var(--m-land);border:1px solid var(--line)}
.state-demo .road{position:absolute;height:4px;background:var(--m-road);border-radius:2px;box-shadow:0 0 0 1.5px var(--m-case)}
.state-demo .bm{position:absolute}
.state-demo .alert-mini{position:absolute;left:12px;right:12px;top:10px;height:26px;border-radius:7px;background:var(--surface);border:1px solid var(--crit-line);box-shadow:0 0 0 3px var(--crit-soft);display:flex;align-items:center;gap:6px;padding:0 8px;font-size:11px;font-weight:600;color:var(--crit)}
.ctable{width:100%;border-collapse:collapse;font-size:13px}
.ctable th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:0 12px 10px 0;border-bottom:1px solid var(--line)}
.ctable td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);color:var(--text-2);vertical-align:top}
.ctable td:first-child{white-space:nowrap;color:var(--text);font-weight:500}
.ctable .num{color:var(--text)}
.tbl-wrap{overflow-x:auto}
.formula{font:500 13px/1.7 var(--f-num);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--text);margin:12px 0 0;overflow-x:auto;white-space:pre}
.keys{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:13.5px;color:var(--text-2)}
.keys .kbd{justify-self:start;font-size:12px;padding:4px 7px}
.note{font-size:12.5px;color:var(--text-3);margin-top:16px}

/* ---------- responsive ---------- */
@media (max-width:1440px){
  .app{--side-w:360px;--drawer-w:560px;grid-template-columns:64px minmax(0,1fr) var(--side-w)}
  .search{width:200px}
  .kpi{padding:0 14px}
}
@media (max-width:1180px){
  .search{display:none}
  .tb-title p{display:none}
}
@media (max-width:900px){
  body{overflow:auto}
  .app{display:flex;flex-direction:column;height:auto;min-height:100%}
  .rail{flex-direction:row;padding:8px 16px;gap:4px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .rail .logo{margin:0 8px 0 0;width:34px;height:34px}
  .rail-spacer{display:none}
  .rail-btn .tip{display:none}
  .topbar{flex-wrap:wrap;gap:10px 16px;padding:12px 16px;height:auto}
  .kpis{flex-wrap:wrap;gap:8px 0;width:100%}
  .kpi{padding:0 12px}
  .tb-right{margin-left:0}
  .stage{height:62vh;min-height:420px;flex:none}
  .side{border-left:0;border-top:1px solid var(--line);min-height:420px}
  .drawer{position:fixed;top:0;width:100%}
  .dz-head,.dz-body,.dz-foot{padding-left:16px;padding-right:16px}
  .dz-foot{flex-wrap:wrap}
  .kv{grid-template-columns:1fr 1fr}
  .kv .wide{grid-column:1/3}
  .legend,.basemap-sw{display:none}
  .scen{left:16px;right:16px;transform:none;width:auto}
  .app.drawer-open .scen{display:none}
  .alert{flex-wrap:wrap}
  .alert-actions{width:100%}
  .alert-actions .btn{flex:1}
  .scen-steps{display:none}
  .ux-hero,.grid2,.grid3{grid-template-columns:1fr}

  .fl:nth-child(odd){border-left:0}

  .metrics{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ================= v2 · «Парящая оболочка» =================
   Приложение — скруглённая оболочка на лавандовом фоне; навигация — круги; управление — пилюли;
   KPI — карточки (бренд-градиент, тёмная при аварии); над картой — стекло; выбранное светится. */
:root{
  --brand-50:#F4F1FF; --brand-100:#E9E4FF; --brand-200:#D3C9FF; --brand-300:#B7A8FF; --brand-400:#A08FFF; --brand-500:#8C76FF; --brand-600:#7A62F0; --brand-700:#634BD6; --brand-800:#4B37A8; --brand-900:#2E2270;
  --brand:#7A62F0; --brand-grad:linear-gradient(135deg,#A08FFF 0%,#7A62F0 55%,#634BD6 100%);
  --brand-glow:rgba(122,98,240,.45); --brand-soft:rgba(140,118,255,.12); --brand-line:rgba(140,118,255,.40); --brand-hatch:rgba(140,118,255,.30);
  --canvas:#E7E3F1; --bg:#F5F3FA; --surface:#FFFFFF; --surface-2:#F3F0FA; --surface-3:#EBE7F5;
  --line:#E7E2F1; --line-strong:#D6CFE7; --text:#16121F; --text-2:#5A556E; --text-3:#8D88A2;
  --glass:rgba(255,255,255,.70); --glass-line:rgba(255,255,255,.75);
  --shadow-s:0 1px 2px rgba(46,34,112,.06),0 6px 16px -6px rgba(46,34,112,.12);
  --shadow:0 2px 4px rgba(46,34,112,.06),0 18px 40px -12px rgba(46,34,112,.22);
  --shadow-l:0 40px 90px -30px rgba(75,55,168,.38),0 12px 30px -12px rgba(22,18,31,.10);
  --dark-card:#18132A; --dark-card-2:#231C3D;
  --overlay:rgba(231,227,241,.86);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --brand:#8C76FF; --brand-grad:linear-gradient(135deg,#A08FFF 0%,#7A62F0 55%,#5A42CC 100%);
  --brand-glow:rgba(140,118,255,.40); --brand-soft:rgba(140,118,255,.15); --brand-line:rgba(140,118,255,.45); --brand-hatch:rgba(140,118,255,.35);
  --canvas:#05040A; --bg:#0D0B16; --surface:#151222; --surface-2:#1B1729; --surface-3:#241F37;
  --line:#272240; --line-strong:#352E52; --text:#EEEAF8; --text-2:#A6A0BC; --text-3:#6E6886;
  --glass:rgba(21,18,34,.66); --glass-line:rgba(255,255,255,.07);
  --shadow-s:0 1px 2px rgba(0,0,0,.4),0 8px 20px -8px rgba(0,0,0,.55);
  --shadow:0 2px 4px rgba(0,0,0,.4),0 22px 48px -14px rgba(0,0,0,.7);
  --shadow-l:0 40px 100px -30px rgba(90,66,204,.35),0 16px 40px -12px rgba(0,0,0,.6);
  --dark-card:#0A0812; --dark-card-2:#1A1430; --overlay:rgba(5,4,10,.86);
}}
:root[data-theme="dark"]{
  --brand:#8C76FF; --brand-grad:linear-gradient(135deg,#A08FFF 0%,#7A62F0 55%,#5A42CC 100%);
  --brand-glow:rgba(140,118,255,.40); --brand-soft:rgba(140,118,255,.15); --brand-line:rgba(140,118,255,.45); --brand-hatch:rgba(140,118,255,.35);
  --canvas:#05040A; --bg:#0D0B16; --surface:#151222; --surface-2:#1B1729; --surface-3:#241F37;
  --line:#272240; --line-strong:#352E52; --text:#EEEAF8; --text-2:#A6A0BC; --text-3:#6E6886;
  --glass:rgba(21,18,34,.66); --glass-line:rgba(255,255,255,.07);
  --shadow-s:0 1px 2px rgba(0,0,0,.4),0 8px 20px -8px rgba(0,0,0,.55);
  --shadow:0 2px 4px rgba(0,0,0,.4),0 22px 48px -14px rgba(0,0,0,.7);
  --shadow-l:0 40px 100px -30px rgba(90,66,204,.35),0 16px 40px -12px rgba(0,0,0,.6);
  --dark-card:#0A0812; --dark-card-2:#1A1430; --overlay:rgba(5,4,10,.86);
}
body{background:var(--canvas)}
.dim{color:var(--text-3);font-weight:500}

/* shell */
.app{--drawer-w:600px;--side-w:400px;grid-template-columns:88px minmax(0,1fr) var(--side-w);grid-template-rows:84px minmax(0,1fr);column-gap:12px;padding:0 12px 12px 0;margin:10px;height:calc(100% - 20px);border-radius:30px;background:var(--bg);box-shadow:var(--shadow-l);overflow:hidden}
.rail{background:transparent;border-right:0;gap:10px;padding:18px 0}
.logo{width:48px;height:48px;margin-bottom:18px;filter:drop-shadow(0 8px 16px var(--brand-glow))}
.rail-btn{width:48px;height:48px;border-radius:50%;background:var(--surface);color:var(--text-2);box-shadow:var(--shadow-s)}
.rail-btn:hover{background:var(--surface);color:var(--brand);transform:translateY(-1px)}
.rail-btn.is-active{background:var(--brand-grad);color:#fff;box-shadow:0 12px 26px -10px var(--brand-glow),inset 0 1px 0 rgba(255,255,255,.25)}

.avatar{width:44px;height:44px;background:var(--brand-grad);color:#fff;box-shadow:0 8px 18px -8px var(--brand-glow)}

/* top bar: KPI as cards */
.topbar{background:transparent;border-bottom:0;padding:0 0 0 6px;gap:18px}
.tb-title h1{font-size:20px;letter-spacing:-.02em}
.kpis{gap:10px}
.kpi{border-left:0!important;padding:9px 16px!important;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-s);min-width:112px;gap:1px}
.kpi-v{font-size:21px;font-weight:700}
.kpi-v small,.kpi-v .dim{font-size:13px;color:var(--text-3);font-weight:500}

.kpi.k-brand .kpi-l{color:rgba(255,255,255,.78)} .kpi.k-brand .kpi-v{color:#fff} .kpi.k-brand .kpi-v .dim,.kpi.k-brand .kpi-v small{color:rgba(255,255,255,.62)}
.kpi.is-crit{animation:none;background:var(--dark-card);box-shadow:0 0 0 3px var(--crit-soft),0 14px 28px -12px rgba(229,50,63,.45)}
.kpi.is-crit .kpi-l{color:rgba(255,255,255,.7)} .kpi.is-crit .kpi-v{color:var(--crit-dot)}
.search{height:44px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-s);padding:0 8px 0 16px}

/* stage & side as cards */
.stage{border-radius:26px;box-shadow:var(--shadow-s);isolation:isolate}
.side{border-left:0;border-radius:26px;box-shadow:var(--shadow-s);overflow:hidden}
.tabs{gap:6px;padding:14px 14px 12px}
.tab{padding:8px 14px;border-radius:999px;transition:background .15s,color .15s}
.tab[aria-selected="true"]{background:var(--text);color:var(--bg)}
.tab[aria-selected="true"]::after{display:none}
.tab[aria-selected="true"] .cnt{background:rgba(127,127,127,.28);color:inherit}
.tab .cnt.crit,.tab[aria-selected="true"] .cnt.crit{background:var(--crit-dot);color:#fff}
.ev{border-radius:14px}
.ev-crit{border-radius:22px!important;background:linear-gradient(140deg,var(--crit-soft),transparent 80%),var(--surface);box-shadow:0 18px 36px -18px rgba(229,50,63,.45)}
.ev-progress{border-radius:22px!important;background:linear-gradient(140deg,var(--brand-soft),transparent 85%),var(--surface);box-shadow:0 18px 36px -18px var(--brand-glow)}
.bar i{background:var(--brand-grad)}
.rrow{border-radius:16px}
.rrow.is-sel{background:linear-gradient(120deg,var(--brand-soft),transparent);box-shadow:inset 0 0 0 1px var(--brand-line)}
.rb{border-radius:999px;padding:0 9px}
.rb.is-brand{background:var(--brand-grad)}

/* pills everywhere */
.btn{border-radius:999px;padding:0 18px}
.btn-lg{border-radius:999px;padding:0 24px}
.btn-primary{background:var(--brand-grad);color:#fff;box-shadow:0 12px 24px -10px var(--brand-glow),inset 0 1px 0 rgba(255,255,255,.22)}
.btn-primary:hover{box-shadow:0 16px 30px -10px var(--brand-glow),inset 0 1px 0 rgba(255,255,255,.22);transform:translateY(-1px)}
.btn-danger{background:linear-gradient(135deg,#FF6B74,#E5323F);box-shadow:0 12px 24px -10px rgba(229,50,63,.55),inset 0 1px 0 rgba(255,255,255,.22)}

.chip{border-radius:999px;padding:0 10px}

/* glass over the map */
.chipbtn,.basemap-sw,.mapctl,.legend,.alert,.scen,.eta-tag{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.chipbtn{border-radius:999px;height:36px;padding:0 14px}

.mapctl{border-radius:999px}
.mapctl button+button{border-top:1px solid var(--line)}
.legend{border-radius:22px;padding:14px 16px}
.alert{border-radius:24px;border:1px solid var(--crit-line);box-shadow:0 0 0 4px var(--crit-soft),var(--shadow)}

.alert-ic{border-radius:50%;background:linear-gradient(135deg,#FF6B74,#E5323F);box-shadow:0 8px 18px -6px rgba(229,50,63,.6)}

.toast{border-radius:999px}

/* drawer: floating card */
.drawer{top:84px;right:12px;bottom:12px;border-left:0;border-radius:26px;box-shadow:var(--shadow-l);transform:translateX(calc(100% + 30px))}

.dz-head{border-bottom:1px solid var(--line)}

.strip{border-radius:22px;background:var(--surface-2)}
.iv-row i{border-radius:7px}
.iv-row i.new{background:repeating-linear-gradient(135deg,var(--brand-hatch) 0 3px,transparent 3px 7px),var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand-line)}
.iv-row i.gap{background:repeating-linear-gradient(135deg,rgba(229,50,63,.22) 0 3px,transparent 3px 7px),var(--crit-soft)}
.cand{border-radius:22px;background:var(--surface);transition:box-shadow .2s,background .2s,border-color .2s}
.cand:hover{box-shadow:var(--shadow-s)}
.cand.is-sel{border-color:transparent;background:radial-gradient(120% 140% at 0% 0%,rgba(140,118,255,.22),transparent 60%),var(--surface);box-shadow:0 0 0 1.5px var(--brand),0 22px 44px -18px var(--brand-glow)}
.cand.is-off{background:var(--surface-2)}
.c-radio{border-radius:50%}

.c-eta b{font-size:24px}
.c-eta b .dim{font-size:13px}
.reco{border-radius:999px;background:var(--brand-grad);box-shadow:0 8px 16px -6px var(--brand-glow);padding:3px 10px}

.dz-foot{border-top:1px solid var(--line);background:linear-gradient(180deg,transparent,var(--brand-soft))}
.metric{border-radius:18px;background:var(--surface-2);border:0}

/* UX page */
.ux{background:var(--canvas)}
.ux-top{background:var(--canvas)}

.formula{border-radius:18px}

/* v2 · refinements */

.is-brief .cand:not(.is-sel) .c-line1{align-items:center}
