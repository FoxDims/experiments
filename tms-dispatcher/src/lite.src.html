.is-brief .cand .c-tags .norm{display:none}
.is-brief .cand .c-tags:not(:has(.chip:not(.norm))){display:none}
.is-brief .cand .c-key{opacity:0;transition:opacity .15s}
.is-brief .cand:hover .c-key{opacity:1}
.is-brief .cands{gap:6px}
.is-brief .cand.is-sel{margin-top:4px}

/* сломанный борт: где, когда, сколько людей */
.is-brief .broken .more-btn{display:inline-flex;margin-left:4px}
.is-brief .broken-top .chip{margin-left:auto}
.is-brief .broken:not(.is-open) :is(.broken-top .sub,.kv .more,.kv dd small){display:none}
.is-brief .broken:not(.is-open) .kv{grid-template-columns:minmax(0,1fr) max-content max-content;column-gap:32px;align-items:end}
.is-brief .broken:not(.is-open) .kv .wide{grid-column:auto}
.is-brief .broken:not(.is-open) .broken-top{margin-bottom:14px}
.is-brief .broken.is-open .more-btn .ic{transform:rotate(180deg)}

/* окно автобуса на карте */
.is-brief .bp:not(.is-open) :is(dl,.bp-h>span:not(.rb):not(.chip)){display:none}
.is-brief .bp:not(.is-open) .bp-h{margin-bottom:6px}
.is-brief .bp:not(.is-open) .bp-sum{display:block;font-size:13px;color:var(--text-2)}
.is-brief .bp .more-btn{display:inline-flex;margin-top:6px}
.is-brief .bp.is-open .more-btn{order:9;margin:10px 0 0}
.is-brief .bp.is-open .more-btn .ic{transform:rotate(180deg)}
.is-brief .bp.is-open{display:flex;flex-direction:column}
.bp-h .chip{margin-left:auto;margin-right:16px}
.is-brief .bp dl :is(dt,dd):nth-of-type(2){display:none}
body:not(.is-brief) .bp-h .chip{display:none}

/* лента: одна строка, подробности по клику */
.is-brief #feed .ev{cursor:pointer;padding-top:9px;padding-bottom:9px}
.is-brief #feed .ev:hover{background:var(--surface-2)}
.is-brief #feed .ev:not(.is-open) .ev-s{display:none}
.is-brief #feed .ev:not(.is-open) .ev-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* маршруты: в норме только номер и название */
.is-brief .rcard.is-ok:not(.is-sel){padding:10px 14px;margin-bottom:6px}
.is-brief .rcard.is-ok:not(.is-sel) :is(.rm,.rbar,.chip){display:none}
.is-brief .rcard.is-ok:not(.is-sel)::after{content:"";grid-column:3;grid-row:1;width:8px;height:8px;border-radius:50%;background:var(--ok);justify-self:end;margin-right:4px}
@media (max-width:1180px){ .dens button{padding:0 10px} }

/* ---- lite: панель демо скрыта, легенда — выпадашка, карточка сломанного в одну строку ---- */
.scen{display:none!important}
.lg-wrap{position:relative}
.lg-btn .lg-dots{display:inline-flex;gap:3px}
.lg-btn .lg-dots .sdot{width:7px;height:7px;margin:0}
.lg-btn>.ic:last-child{width:14px;height:14px;transition:transform .2s;opacity:.7}
.lg-btn[aria-expanded="true"]{color:var(--text)}
.lg-btn[aria-expanded="true"]>.ic:last-child{transform:rotate(180deg)}
.lg-wrap .legend,.stage.on-yandex .lg-wrap .legend{position:absolute;top:calc(100% + 8px);left:0;bottom:auto;min-width:220px}
.lg-wrap .legend .lg-h{display:none}
.loc-btn{display:inline-grid;place-items:center;width:28px;height:28px;margin-left:6px;border-radius:999px;color:var(--brand);background:var(--brand-soft);flex:none;transition:background .15s}
.loc-btn:hover{background:var(--brand);color:#fff}
.loc-btn .ic{width:15px;height:15px}
.is-brief .broken:not(.is-open){padding:16px 20px 18px}
.is-brief .broken:not(.is-open) .broken-top{margin-bottom:12px}
.is-brief .broken:not(.is-open) .kv{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);column-gap:20px;align-items:start}
.is-brief .broken:not(.is-open) .kv dd{display:flex;align-items:center;min-height:28px;flex-wrap:wrap}
.broken.is-open .loc-btn{vertical-align:middle}

/* ---- lite: «Влияние на маршрут» свёрнуто до строки итогов, схема и интервалы по клику ---- */
.imp-h{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
.dz-sec .imp-h span{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-weight:600}
.imp-h .ic{width:14px;height:14px;transition:transform .2s}
.imp-h:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:6px}
.imp.is-open .imp-h .ic{transform:rotate(180deg)}
.imp:not(.is-open) .strip>svg,.imp:not(.is-open) .strip .iv{display:none}
.imp:not(.is-open) .strip{padding:12px 16px;cursor:pointer}
.imp:not(.is-open) .impact{margin-top:0}

/* ---- lite: бежевый фон подложки Яндекса (JS API 3.0) сдвигаем к фирменному лавандовому; белые дороги остаются нейтральными ---- */
/* только сам слой карты (canvas): логотип, копирайт и «Открыть Яндекс Карты» — это обычные элементы поверх, их цвета не трогаем */
.stage.on-yandex.ym-min:not(.ym21) #ymap canvas{filter:var(--ym3-tint)}

/* ---- lite: топбар без подписи и часов, поиск по центру; показатели — полоса над событиями ---- */
.tb-title p,.clock{display:none!important}
.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) var(--side-w);column-gap:12px;padding-right:0}
.topbar .tb-right{grid-column:2;margin:0;justify-self:center}
.topbar .search{width:420px}
.avatar{position:relative;cursor:default;outline:0}
.avatar .tip{z-index:20;box-shadow:var(--shadow-s);position:absolute;left:56px;top:50%;transform:translateY(-50%);background:var(--text);color:var(--surface);font-size:12px;font-weight:500;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.avatar:hover .tip,.avatar:focus-visible .tip{opacity:1}

.kpi-dock .kpis{display:flex;gap:0;margin:14px 14px 0;padding:10px 4px;background:var(--surface-2);border-radius:18px;flex:none}
.kpi-dock .kpi{flex:1 1 auto;min-width:0!important;padding:0 10px!important;background:none!important;box-shadow:none!important;border-radius:0;border-left:1px solid var(--line)!important;display:flex;flex-direction:column;gap:2px;animation:none}
.kpi-dock .kpi:first-child{border-left:0!important}
.kpi-dock .kpi-l{font-size:10.5px;letter-spacing:0;color:var(--text-3)!important;gap:5px}
.kpi-dock .kpi-l .sdot{width:6px;height:6px;margin:0}
.kpi-dock .kpi-v{font-size:17px;font-weight:700;color:var(--text)!important;line-height:1.15}
.kpi-dock .kpi-v small,.kpi-dock .kpi-v .dim{font-size:11px!important;color:var(--text-3)!important}
.kpi-dock .kpi.k-reg{display:grid;grid-template-columns:auto auto;column-gap:6px;align-items:end}
.kpi-dock .kpi.k-reg .kpi-l{grid-column:1/3}
.kpi-dock .kpi.k-reg .kpi-v{color:var(--brand)!important}
.kpi-dock .kpi.k-reg .spark{width:36px;height:16px;margin-bottom:3px}
.kpi-dock .kpi .spark path:first-child{fill:var(--brand-soft)}
.kpi-dock .kpi .spark path:nth-child(2){stroke:var(--brand);stroke-width:2.4}
.kpi-dock .kpi .spark circle{fill:var(--brand);stroke:none}
.kpi-dock .kpi.is-crit .kpi-v{color:var(--crit)!important}
.kpi-dock .kpi.is-crit .sdot{animation:kpiDot 1.2s ease-in-out infinite}
@keyframes kpiDot{50%{box-shadow:0 0 0 4px var(--crit-soft)}}

/* ---- lite: шапка окна замены без строки инцидента; компактный сломанный борт ---- */
.dz-head{padding-top:16px;padding-bottom:14px;align-items:center}
.dz-close{grid-row:1}
.is-brief .broken:not(.is-open){padding:12px 16px 12px}
.is-brief .broken:not(.is-open) .broken-top{margin-bottom:6px}
.is-brief .broken:not(.is-open) .broken-id{font-size:22px}
.is-brief .broken:not(.is-open) .kv{row-gap:0}
.is-brief .broken:not(.is-open) .kv dt{font-size:11px;margin-bottom:0}
.is-brief .broken:not(.is-open) .kv dd{min-height:26px;font-size:13.5px}
.is-brief .broken:not(.is-open) .loc-btn{width:24px;height:24px}
.broken{border-radius:18px}

.kpi-dock .kpis{margin:12px 12px 0;padding:10px 2px}
.kpi-dock .kpi{flex:1 1 auto;padding:0 7px!important}
.kpi-dock .kpi:first-child{padding-left:10px!important}
.kpi-dock .kpi:last-child{padding-right:10px!important}
.kpi-dock .kpi-l{font-size:10px;white-space:nowrap}
.kpi-dock .kpi-v{font-size:16px}
.kpi-dock .kpi-v small{letter-spacing:-.02em}
.kpi-dock .kpi.k-reg .spark{width:30px;height:14px}
.is-brief .broken:not(.is-open){padding:10px 16px}
.is-brief .broken:not(.is-open) .broken-top{margin-bottom:4px}
.is-brief .broken:not(.is-open) .broken-top .chip{height:22px}
.is-brief .broken:not(.is-open) .kv dd{min-height:24px}

/* показатели в топбаре: ширина и правый край — как у правой колонки */
.kpi-dock .kpis{grid-column:4;margin:0!important;width:100%;box-sizing:border-box;background:var(--surface);box-shadow:var(--shadow-s);border:1px solid var(--line);align-self:center}

/* ---- lite: окно замены шириной с правую колонку ---- */
.app{--drawer-w:var(--side-w)}
.dz-head,.dz-body,.dz-foot{padding-left:16px;padding-right:16px}
.dz-head h2{font-size:19px}
.dz-body{gap:20px}
.dz-sec h3{flex-wrap:wrap}
.dz-sec h3>span{font-size:11px}
.cand{padding-left:14px;padding-right:14px;column-gap:12px}
.dz-foot{gap:8px}
.dz-foot .btn-lg{padding:0 16px}
.dz-foot [data-primary]{flex:1;justify-content:center}
.is-brief .broken:not(.is-open){padding:10px 14px}
.is-brief .broken:not(.is-open) .kv{column-gap:12px}
.impact{gap:6px 14px}
.cand .c-line1{align-items:center;column-gap:8px;row-gap:2px}
.cand .c-model{order:9;flex-basis:100%}
.cand .c-place{margin-top:1px}
.broken.is-open .broken-top{flex-wrap:wrap;row-gap:4px}
.broken.is-open .broken-top .sub{order:9;flex-basis:100%}
.broken.is-open .kv{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.broken.is-open .kv .wide{grid-column:1/-1}
/* lite: строка итога «Борт → М10 · прибытие…» не показывается — то же видно в выбранной карточке */
#dzSum{display:none}

/* lite: в выбранном резерве модель, госномер и водитель — под «Подробнее» */
.is-brief .cand.is-sel:not(.c-open) :is(.c-model,.c-driver){display:none}
.is-brief .cand.is-sel .c-line1{flex-wrap:nowrap}
.is-brief .cand.is-sel.c-open .c-line1{flex-wrap:wrap}
.is-brief .cand.is-sel.c-open .c-model{order:9}

/* lite: «Подробнее» — круглый шеврон справа, на одной вертикали у всех карточек */
.chev-btn{display:grid;place-items:center;width:28px;height:28px;border-radius:999px;color:var(--text-3);flex:none;transition:background .15s,color .15s}
.chev-btn:hover{background:var(--surface-3);color:var(--text)}
.chev-btn .ic{width:16px;height:16px;transition:transform .2s}
.chev-slot{width:28px}
.cand{grid-template-columns:auto minmax(0,1fr) auto 28px}
.cand .chev-btn,.cand .chev-slot{grid-column:4;grid-row:1/3;align-self:center;margin-right:-4px}
.cand.is-sel .chev-btn{align-self:start;margin-top:-2px}
.cand.c-open.is-sel .chev-btn .ic{transform:rotate(180deg)}
.cand .c-warn,.cand .c-tags{grid-column:2/5}
.broken-top .chev-btn{margin-right:-4px}
.broken.is-open .broken-top .chev-btn .ic{transform:rotate(180deg)}
.is-brief .broken:not(.is-open) .broken-top .chip{margin-left:auto}
.broken.is-open .broken-top .chip{margin-left:auto}
.c-driver{white-space:nowrap;min-width:0}
.c-driver .dim{overflow:hidden;text-overflow:ellipsis}
.broken.is-open{padding:14px}
.cand,.is-brief .cand:not(.is-sel){padding-right:14px}
.broken-top .chev-btn,.cand .chev-btn,.cand .chev-slot,.cand.is-sel .chev-btn{margin-right:0}
/* lite: подсказка об отмене — строкой над кнопками */
.dz-foot .dz-note{flex:1 1 100%;text-align:center}
/* lite: смысловые блоки окна замены разделены крупнее */
.dz-body{gap:32px;padding-top:20px}
.dz-sec h3{margin-bottom:12px}

/* ---- lite: топбар — показатели слева (крупно), поиск в середине, пользователь справа ---- */
.topbar{display:flex!important;align-items:center;gap:20px;padding:0 0 0 6px}
.kpi-dock .kpis{grid-column:auto;width:auto;flex:none;padding:10px 4px;border-radius:20px}
.kpi-dock .kpi{flex:none;padding:0 18px!important;gap:3px}
.kpi-dock .kpi:first-child{padding-left:18px!important}
.kpi-dock .kpi:last-child{padding-right:18px!important}
.kpi-dock .kpi-l{font-size:12px;gap:6px}
.kpi-dock .kpi-l .sdot{width:7px;height:7px}
.kpi-dock .kpi-v{font-size:22px;line-height:1.1}
.kpi-dock .kpi-v small,.kpi-dock .kpi-v .dim{font-size:14px!important}
.kpi-dock .kpi.k-reg{column-gap:10px}
.kpi-dock .kpi.k-reg .spark{width:56px;height:20px;margin-bottom:4px}
.topbar .tb-right{flex:1;justify-content:center;min-width:0;margin:0}
.topbar .search{width:100%;max-width:420px}
.tb-user{display:flex;align-items:center;gap:12px;flex:none;padding:6px 18px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-s)}
.tb-user .avatar{margin:0;width:44px;height:44px}
.tb-user-t{display:flex;flex-direction:column;line-height:1.25}
.tb-user-t b{font-size:14px;font-weight:600;white-space:nowrap}
.tb-user-t span{font-size:12px;color:var(--text-3);white-space:nowrap}
@media (max-width:1440px){
  .kpi-dock .kpi{padding:0 12px!important}
  .kpi-dock .kpi:first-child{padding-left:14px!important}
  .kpi-dock .kpi:last-child{padding-right:14px!important}
  .kpi-dock .kpi-v{font-size:19px}
  .kpi-dock .kpi.k-reg .spark{width:40px}
  .tb-user-t span{display:none}
}

/* ---- lite: без топбара — карта и правые панели на всю высоту; поиск сверху, показатели снизу по центру карты ---- */
.topbar{display:none!important}
.app{grid-template-rows:minmax(0,1fr);padding:12px 12px 12px 0}
.rail,.stage,.side{grid-row:1}
.drawer{top:12px}
.search-top{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:550;width:420px;max-width:calc(100% - 340px)}
.search-top .search{width:100%;height:44px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.kpi-dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:550;max-width:calc(100% - 32px);transition:bottom .2s}
.kpi-dock{--dock-base:16px;bottom:calc(var(--dock-base) + var(--dock-lift,0px))!important}
.kpi-dock .kpis{display:flex;padding:10px 4px;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--glass-line);box-shadow:var(--shadow);margin:0!important;width:auto}
.kpi-dock .kpi{border-left:1px solid var(--line)!important;background:none!important;box-shadow:none!important;border-radius:0;min-width:0!important;display:flex;flex-direction:column;animation:none}
.kpi-dock .kpi:first-child{border-left:0!important}
.kpi-dock .kpi-l{color:var(--text-3)!important;letter-spacing:0;white-space:nowrap}
.kpi-dock .kpi-v{font-weight:700;color:var(--text)!important}
.kpi-dock .kpi.k-reg{display:grid;grid-template-columns:auto auto;align-items:end}
.kpi-dock .kpi.k-reg .kpi-l{grid-column:1/3}
.kpi-dock .kpi.k-reg .kpi-v{color:var(--brand)!important}
.kpi-dock .kpi .spark path:first-child{fill:var(--brand-soft)}
.kpi-dock .kpi .spark path:nth-child(2){stroke:var(--brand);stroke-width:2.4}
.kpi-dock .kpi .spark circle{fill:var(--brand);stroke:none}
.kpi-dock .kpi.is-crit .kpi-v{color:var(--crit)!important}
.kpi-dock .kpi.is-crit .sdot{animation:kpiDot 1.2s ease-in-out infinite}
.alert{top:72px}
.toast{bottom:112px}
.stage.on-yandex .toast{bottom:140px}
.avatar .user-tip{display:flex;flex-direction:column;gap:2px;line-height:1.3;bottom:0;top:auto;transform:none;padding:8px 12px}
.avatar .user-tip b{font-size:13px}
.avatar .user-tip span{font-size:11.5px;opacity:.75}
/* на экранах уже ~1800 px кнопки слоёв опускаются под поиск, чтобы не наезжать */
@media (max-width:1800px){ .overlay-tl{top:72px} .alert{top:128px} }
.dz-foot:not(:has(.dz-note)){flex-wrap:nowrap}
@media (max-width:1440px){ .dz-foot .kbd{display:none} }

/* ================= Разделы: маршруты, состав, инциденты, аналитика ================= */
.view{grid-column:2/4;grid-row:1;z-index:6;display:grid;grid-template-columns:minmax(0,1fr) var(--side-w);gap:12px;min-height:0}
.view.is-wide{grid-template-columns:minmax(0,1fr)}
.view.is-wide .v-detail{display:none}
.v-main,.v-detail{background:var(--surface);border-radius:26px;box-shadow:var(--shadow-s);min-height:0;overflow:hidden}
.v-main{display:flex;flex-direction:column}
.v-detail{overflow:auto}
.v-head{display:flex;align-items:center;gap:12px;padding:22px 24px 6px}
.v-head h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.v-head p{margin:2px 0 0;font-size:13px;color:var(--text-3)}
.v-back{display:none;width:40px;height:40px;border-radius:50%;background:var(--surface-2);place-items:center;color:var(--text)}
.v-back::before{content:"";width:9px;height:9px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateX(2px) rotate(45deg)}
.v-tools{display:flex;align-items:center;gap:12px;padding:12px 24px 14px;flex-wrap:wrap}
.v-search{flex:1 1 260px;max-width:420px;height:42px!important;background:var(--surface-2)!important;box-shadow:none!important;border:1px solid var(--line)!important}
.v-search input{font-size:13.5px}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto;max-width:100%}
.seg button{height:32px;padding:0 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--text-2);white-space:nowrap}
.seg button .num{color:var(--text-3);font-weight:600;margin-left:2px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--surface)}
.seg button[aria-pressed="true"] .num{color:inherit;opacity:.7}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.v-body{flex:1;overflow:auto;padding:0 14px 16px;min-height:0}
.v-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.v-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:13px 14px;border-radius:18px;cursor:pointer;transition:background .15s,box-shadow .15s}
.v-row:hover{background:var(--surface-2)}
.v-row:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.v-row.is-sel{background:linear-gradient(120deg,var(--brand-soft),transparent);box-shadow:inset 0 0 0 1.5px var(--brand)}
.v-row.is-crit{background:linear-gradient(120deg,var(--crit-soft),transparent 70%)}
.v-row-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.v-row-main b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-row-main span{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-row-num{font:700 15px var(--f-num);color:var(--text);min-width:52px;text-align:right}
.v-row-num small{font-size:11px;color:var(--text-3)}
.v-row .sdot{margin:0 4px}
.v-id{font:700 15px var(--f-num);min-width:44px}
.v-row .v-id{grid-column:1}
.v-row:has(.v-id) {grid-template-columns:auto minmax(0,1fr) auto}
.v-empty{padding:40px 16px;text-align:center;color:var(--text-3);font-size:13.5px}
.v-ph{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px;text-align:center;color:var(--text-3)}
.v-ph .ic{width:36px;height:36px;opacity:.5}
.v-ph p{margin:0;max-width:240px;font-size:13.5px;line-height:1.5}
.v-card{padding:22px 22px 24px}
.v-dhead{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
.v-dhead h3{margin:0 0 8px;font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.rb.lg{min-width:48px;height:36px;font-size:16px;border-radius:12px}
.v-id.lg{font-size:22px;min-width:0;padding-top:2px}
.v-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;flex:none}
.v-ic.crit{background:var(--crit-soft);color:var(--crit)} .v-ic.ok{background:var(--ok-soft);color:var(--ok)} .v-ic.warn{background:var(--warn-soft);color:var(--warn)} .v-ic.brand{background:var(--brand-soft);color:var(--brand)}
.v-kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin:0}
.v-kv div{min-width:0}
.v-kv dt{font-size:11.5px;color:var(--text-3);margin-bottom:3px}
.v-kv dd{margin:0;font-size:14px;font-weight:500}
.v-kv dd small{color:var(--text-3);font-size:12px;margin-left:4px}
.v-card h4{margin:22px 0 10px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.v-term{display:flex;flex-direction:column;gap:8px;position:relative;padding-left:4px}
.v-term span{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500}
.v-term i{width:10px;height:10px;border-radius:50%;border:2px solid var(--brand);background:var(--surface)}
.v-term small{color:var(--text-3);font-size:12px;padding-left:20px}
.v-mini{list-style:none;margin:0;padding:0}
.v-mini li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.v-mini li:last-child{border-bottom:0}
.v-mini li span:nth-child(2){color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-cta{width:100%;height:46px;margin-top:22px;border-radius:999px}
.v-acts{display:flex;gap:8px;margin-top:22px}
.v-acts .btn{flex:1;height:46px;border-radius:999px}
.v-driver{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface-2);margin-bottom:18px}
.v-driver b{display:block;font-size:14px}
.v-driver span{font-size:12.5px;color:var(--text-3)}
.v-meter{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;margin-top:16px;font-size:12px;color:var(--text-3)}
.v-meter i{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.v-meter b{display:block;height:100%;border-radius:999px;background:var(--brand)}
.v-meter b.is-low{background:var(--late-dot)}
.v-log{list-style:none;margin:0;padding:0 0 0 6px;border-left:2px solid var(--line)}
.v-log li{position:relative;display:grid;grid-template-columns:48px 1fr;gap:10px;padding:0 0 14px 14px}
.v-log li::before{content:"";position:absolute;left:-7px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.v-log li:first-child::before{border-color:var(--crit-dot);background:var(--crit-dot)}
.v-log span{font:600 12.5px var(--f-num);color:var(--text-2)}
.v-log p{margin:0;font-size:13px;line-height:1.4}
/* аналитика */
.an-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:2px 10px 4px}
.an-card{border:1px solid var(--line);border-radius:22px;padding:18px 20px 20px;min-width:0}
.an-wide{grid-column:1/-1}
.an-card header{margin-bottom:14px}
.an-card h3{margin:0;font-size:15px;font-weight:600}
.an-card header p{margin:2px 0 0;font-size:12.5px;color:var(--text-3)}
.an-card h4{margin:18px 0 10px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.an-tiles{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:12px}
.an-tiles span{display:block;font-size:12px;color:var(--text-3);margin-bottom:2px}
.an-tiles b{font:700 24px var(--f-num);letter-spacing:-.02em}
.an-tiles b small{font-size:13px;color:var(--text-3);font-weight:500}
.an-tiles b.is-crit{color:var(--crit)}
.an-chart{overflow:hidden}
.chart{display:block;max-width:100%;height:auto}
.c-grid{stroke:var(--line);stroke-width:1}
.c-ax{fill:var(--text-3);font:500 11px var(--f-num)}
.c-target{stroke:var(--text-3);stroke-width:1;stroke-dasharray:4 4}
.c-target-l{font-family:var(--f-ui);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.c-area{fill:var(--brand-soft)}
.c-line{fill:none;stroke:var(--brand);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-dot{fill:var(--brand);stroke:var(--surface);stroke-width:2}
.c-cross{stroke:var(--line-strong);stroke-width:1}
.c-hov{fill:var(--surface);stroke:var(--brand);stroke-width:2}
.c-bars,.c-plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.c-bars li,.c-plan li{display:grid;grid-template-columns:46px minmax(0,1fr) 52px;align-items:center;gap:10px;font-size:13px;padding:2px 0;cursor:default}
.c-bars li>i{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.c-bars li>i b{display:block;height:100%;border-radius:999px;background:var(--brand)}
.c-bars li:hover>i b{filter:brightness(1.1)}
.c-bars .num,.c-plan .num{text-align:right;font-weight:600}
.rb.rb-t{font-family:var(--f-ui);font-weight:600;font-size:11.5px;min-width:46px;justify-content:start;padding:0;background:none;place-items:center start}
.c-bars li:has(.rb-t){grid-template-columns:96px minmax(0,1fr) 40px}
.c-plan li>i{display:flex;gap:2px;height:12px}
.c-plan li>i b{flex:1;max-width:44px;border-radius:4px;background:var(--brand)}
.c-plan b.is-miss,.c-legend b.is-miss{background:repeating-linear-gradient(135deg,rgba(229,50,63,.35) 0 3px,transparent 3px 6px),var(--crit-soft);box-shadow:inset 0 0 0 1px var(--crit-line)}
.c-legend{display:flex;gap:18px;margin-top:14px;font-size:12px;color:var(--text-2)}
.c-legend span{display:flex;align-items:center;gap:6px}
.c-legend b{width:14px;height:10px;border-radius:3px;background:var(--brand)}
.tt{position:fixed;z-index:3000;pointer-events:none;background:var(--text);color:var(--surface);padding:7px 10px;border-radius:10px;font-size:12px;box-shadow:var(--shadow);max-width:280px}
.tt b{font-weight:700}
.rail-btn.is-active{background:var(--brand-grad)!important;color:#fff!important}

/* ================= Мобильная версия (до 900 px): таб-бар, шторка событий, профиль ================= */
.tabbar,.sheet-handle,.me-bg{display:none}
@keyframes sheetUp{from{transform:translateY(100%)}}
@media (max-width:900px){
  :root{--tab-h:calc(64px + env(safe-area-inset-bottom,0px));--peek:140px}
  html,body{overflow:hidden!important}
  .app{display:block!important;margin:0!important;padding:0!important;border-radius:0!important;height:100%!important;min-height:0!important;box-shadow:none!important}
  .rail{display:none!important}
  /* карта — над шторкой и таб-баром */
  .stage{position:fixed!important;left:0;right:0;top:0;bottom:calc(var(--tab-h) + var(--peek) - 22px);height:auto!important;min-height:0!important;border-radius:0!important;box-shadow:none!important}
  .search-top{left:12px!important;right:12px;top:calc(12px + env(safe-area-inset-top,0px))!important;transform:none!important;width:auto!important;max-width:none!important}
  .overlay-tl{top:calc(66px + env(safe-area-inset-top,0px))!important;left:12px!important;right:12px;flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
  .overlay-tl::-webkit-scrollbar{display:none}
  .overlay-tl>*{flex:none}
  .overlay-tl #tgStops>.ic,.overlay-tl #tgReserve>.ic{display:none}
  .overlay-tl .chipbtn{padding:0 13px}
  .lg-wrap .legend{position:fixed!important;top:calc(114px + env(safe-area-inset-top,0px))!important;left:12px!important;z-index:700}
  .lg-wrap .legend:not([hidden]){display:flex!important}
  .overlay-tr{top:calc(116px + env(safe-area-inset-top,0px))!important;right:12px!important}
  .app:has(#side:not([data-sheet="peek"])) .alert{display:none!important}
  .mapctl{display:none!important}
  .basemap-sw{display:flex!important}
  .alert{top:calc(116px + env(safe-area-inset-top,0px))!important;left:12px!important;right:12px;width:auto!important;transform:none!important}
  .kpi-dock{--dock-base:30px;left:12px!important;right:12px;transform:none!important;max-width:none!important;overflow-x:auto;scrollbar-width:none;border-radius:20px}
  .kpi-dock::-webkit-scrollbar{display:none}
  .kpi-dock .kpis{width:max-content!important;padding:8px 2px!important}
  .kpi-dock .kpi{padding:0 12px!important}
  .kpi-dock .kpi-v{font-size:18px!important}
  .kpi-dock .kpi-l{font-size:11px!important}
  .kpi-dock .kpi.k-reg .spark{width:36px!important}
  .toast{bottom:calc(var(--peek) + 60px)!important;max-width:calc(100% - 24px)}
  /* правая колонка → шторка над картой */
  .side{position:fixed!important;left:0;right:0;bottom:var(--tab-h);z-index:800;height:var(--peek);min-height:0!important;border-radius:22px 22px 0 0!important;box-shadow:0 -12px 32px -14px rgba(22,18,31,.28)!important;border:0!important;transition:height .3s cubic-bezier(.2,.8,.2,1)}
  .side[data-sheet="half"]{height:56%}
  .side[data-sheet="full"]{height:calc(100% - var(--tab-h) - 52px - env(safe-area-inset-top,0px))}
  .side.is-drag{transition:none}
  .sheet-handle{display:flex;justify-content:center;align-items:center;height:22px;width:100%;flex:none;touch-action:none;cursor:grab}
  .sheet-handle i{width:40px;height:5px;border-radius:3px;background:var(--line-strong)}
  .side .tabs{padding-top:0!important}
  .side-foot{display:none!important}
  /* окно замены — во весь экран */
  .drawer{position:fixed!important;inset:0!important;width:100%!important;max-width:none!important;border-radius:0!important;z-index:2500}
  .dz-head{padding-top:calc(14px + env(safe-area-inset-top,0px))!important}
  .dz-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))!important}
  .dz-foot .kbd{display:none}
  /* разделы — во весь экран над таб-баром */
  .view{position:fixed!important;left:0;right:0;top:0;bottom:var(--tab-h);z-index:850;display:flex!important;flex-direction:column;gap:0;background:var(--surface)}
  .view[hidden]{display:none!important}
  .v-main,.v-detail{border-radius:0!important;box-shadow:none!important}
  .v-main{flex:1;min-height:0}
  .v-head{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 2px}
  .v-head h2{font-size:20px}
  .v-tools{padding:10px 16px 12px;gap:8px}
  .v-search{flex:1 1 100%;max-width:none}
  .seg{width:100%}
  .seg button{flex:1 0 auto;padding:0 12px}
  .v-body{padding:0 6px 16px}
  .v-detail{display:none!important}
  .view.has-detail .v-main{flex:none}
  .view.has-detail .v-tools,.view.has-detail .v-body{display:none}
  .view.has-detail .v-detail{display:block!important;flex:1;min-height:0}
  .view.has-detail .v-back{display:grid}
  .v-card{padding:6px 16px 24px}
  .v-row,.v-row:has(.v-id){grid-template-columns:auto minmax(0,1fr) auto!important;gap:12px;padding:12px 10px}
  .v-row-num{display:none}
  .v-row .chip{max-width:132px;overflow:hidden;text-overflow:ellipsis;display:block;line-height:22px}
  .an-grid{grid-template-columns:1fr;padding:0 10px}
  .an-wide{grid-column:auto}
  .an-card{padding:16px}
  .an-tiles{gap:10px 20px}
  .an-tiles b{font-size:20px}
  .c-bars li:has(.rb-t){grid-template-columns:92px minmax(0,1fr) 28px}
  /* таб-бар */
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;height:var(--tab-h);padding:6px 4px env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);z-index:900}
  .tabbar button{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text-3);min-width:0}
  .tabbar button .ic{width:22px;height:22px}
  .tabbar b{font-size:10.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tabbar button.is-active{color:var(--brand)}
  .tabbar button.is-active::before{content:"";position:absolute;top:3px;left:50%;width:48px;height:30px;margin-left:-24px;border-radius:999px;background:var(--brand-soft);z-index:-1}
  .tabbar .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--crit-dot);color:#fff;font:700 10px/16px var(--f-num);text-align:center;box-shadow:0 0 0 2px var(--surface)}
  .tab-me .avatar{width:28px!important;height:28px!important;font-size:10.5px!important;margin:0!important;box-shadow:none!important}
  .tab-me[aria-expanded="true"]{color:var(--brand)}
  /* профиль и настройки */
  .me-bg{display:flex;align-items:flex-end;position:fixed;inset:0;z-index:2800;background:rgba(10,8,18,.42)}
  .me-bg[hidden]{display:none}
  .me-sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-l);animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
  .me-grip{display:block;width:40px;height:5px;border-radius:3px;background:var(--line-strong);margin:4px auto 14px}
  .me-user{display:flex;align-items:center;gap:12px;padding:0 4px 16px;border-bottom:1px solid var(--line)}
  .me-user .avatar{width:48px!important;height:48px!important;margin:0!important;font-size:15px}
  .me-user b{display:block;font-size:16px}
  .me-user span{font-size:13px;color:var(--text-3)}
  .me-row{display:flex;align-items:center;gap:14px;width:100%;padding:15px 4px;font-size:15px;color:var(--text);border-bottom:1px solid var(--line);text-align:left}
  .me-row>span:nth-child(2){flex:1}
  .me-row .ic{color:var(--text-2)}
  .sw{flex:none;width:46px;height:28px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
  .sw.on{background:var(--brand)}
  .sw.on::after{transform:translateX(18px)}
  .me-go{flex:none;width:9px;height:9px;border-right:2px solid var(--text-3);border-top:2px solid var(--text-3);transform:rotate(45deg);margin-right:6px}
  .me-close{width:100%;height:48px;margin-top:14px;border-radius:999px}
  .ux{z-index:3000!important}
}
@media (max-width:900px) and (prefers-reduced-motion:reduce){ .side,.me-sheet{transition:none;animation:none} }
/* поиск в lite виден на любой ширине (старое правило прятало его на экранах уже 1180 px) */
.search-top .search,.v-tools .search{display:flex!important}

/* справка */
.h-row .v-ic{width:36px;height:36px;border-radius:11px}
.h-row .v-ic .ic{width:18px;height:18px}
.h-art>.chip{margin-bottom:10px}
.h-art h3{margin:0 0 14px;font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.h-art p{margin:0 0 12px;font-size:14px;line-height:1.55;color:var(--text-2)}
.h-art b{color:var(--text);font-weight:600}
.h-steps{margin:4px 0 16px;padding:0;list-style:none;counter-reset:st}
.h-steps li{position:relative;padding:0 0 14px 40px;font-size:14px;line-height:1.5;color:var(--text-2);counter-increment:st}
.h-steps li::before{content:counter(st);position:absolute;left:0;top:-2px;width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font:700 13px/26px var(--f-num);text-align:center}
.h-steps li:not(:last-child)::after{content:"";position:absolute;left:12px;top:28px;bottom:2px;width:2px;background:var(--line)}
.h-list{margin:4px 0 14px;padding-left:18px;font-size:14px;line-height:1.55;color:var(--text-2)}
.h-list li{margin-bottom:8px}
.h-legend{list-style:none;margin:4px 0 14px;padding:0;display:flex;flex-direction:column;gap:10px}
.h-legend li{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.h-legend li p{margin:0;font-size:13px}
.h-note{display:flex;gap:12px;padding:12px 14px;border-radius:16px;background:var(--brand-soft);margin:4px 0 14px}
.h-note .ic{color:var(--brand);flex:none;margin-top:2px}
.h-note p{margin:0;color:var(--text)}
.h-keys{margin:0;display:flex;flex-direction:column}
.h-keys div{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.h-keys div:last-child{border-bottom:0}
.h-keys dt{display:flex;gap:4px;align-items:center}
.h-keys dd{margin:0;font-size:14px;color:var(--text-2)}
.h-art .kbd{font-size:11.5px}
@media (max-width:900px){ .h-legend li{grid-template-columns:1fr;gap:4px} .h-row .chip{display:none!important} }
</style>
</head>
<body>
<div class="app" id="app" data-state="idle">

  <nav class="rail" aria-label="Разделы">
    <svg class="logo" viewBox="0 0 48 48" role="img" aria-label="SmartTransport">
      <rect x="2" y="4" width="40" height="40" rx="11" fill="var(--brand)"/>
      <rect x="11" y="13" width="22" height="22" rx="5" fill="none" stroke="#fff" stroke-width="2.6"/>
      <path d="M11 25h22" stroke="#fff" stroke-width="2.6"/>
      <rect x="10.5" y="34" width="5" height="4" rx="1.5" fill="#fff"/>
      <rect x="28.5" y="34" width="5" height="4" rx="1.5" fill="#fff"/>
      <circle cx="16.5" cy="30" r="1.6" fill="#fff"/><circle cx="27.5" cy="30" r="1.6" fill="#fff"/>
      <circle cx="38" cy="10" r="8.5" fill="#F04A55" stroke="var(--surface)" stroke-width="3"/>
      <path d="M38 6.3V10l2.6 1.6" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <button class="rail-btn is-active" aria-current="page" data-view="map"><span data-ic="map"></span><span class="tip">Оперативная карта</span></button>
    <button class="rail-btn" data-view="routes"><span data-ic="route"></span><span class="tip">Маршруты и расписания</span></button>
    <button class="rail-btn" data-view="fleet"><span data-ic="bus"></span><span class="tip">Подвижной состав</span></button>
    <button class="rail-btn" id="railInc" data-view="incidents"><span data-ic="alert"></span><span class="tip">Инциденты</span><span class="dot" id="railDot" hidden>1</span></button>
    <button class="rail-btn" data-view="analytics"><span data-ic="chart"></span><span class="tip">Аналитика</span></button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="uxBtn" data-view="help"><span data-ic="book"></span><span class="tip">Справка</span></button>
    <button class="rail-btn" id="soundBtn" aria-pressed="true"><span data-ic="volume"></span><span class="tip">Звук аварий: вкл</span></button>
    <button class="rail-btn" id="themeBtn"><span data-ic="moon"></span><span class="tip">Сменить тему</span></button>
    <div class="avatar" tabindex="0" aria-describedby="userTip">АМ<span class="tip user-tip" id="userTip" role="tooltip"><b>Морозова А. С.</b><span id="shiftLine">Старший диспетчер</span></span></div>
  </nav>

  <h1 class="sr">Оперативная обстановка</h1>

  <main class="stage" id="stage">
    <div id="ymap" aria-hidden="true"></div>

  dock.style.setProperty('--dock-lift','0px');
  const dr = dock.getBoundingClientRect();
  const isYa = el => { const t=((el.textContent||'')+' '+(el.getAttribute('aria-label')||'')+' '+(el.getAttribute('title')||'')).trim(); const c=String(el.className&&el.className.baseVal!==undefined?el.className.baseVal:el.className||''); return /Яндекс|Yandex/i.test(t)&&t.length<80 || /copyright|logo|open-block/i.test(c); };

  return ph.map((x,i)=>{ const nx = ph[(i+1)%ph.length]; const gap = ((nx.p - x.p) + L2) % L2 || L2; return {from:x.id, to:nx.id, min: gap/L2*r.cycleMin}; });
}

function cands(){
  return reserves.map(r=>{
    const real = candRoutes[r.id];
    const dist = real ? real.len : hav(r.ll, incident.ll)*1.35;

    const penalty = r.kind==='busy'?6 : r.kind==='depot'?2 : r.kind==='break'?99 : 0;
    const capPen = r.cap < incident.bus.cap ? 3 : 0;
    return {...r, dist, eta, score: eta + penalty + capPen};

function candHTML(c, i){

/* ---------- assign ---------- */
let opts = {tow:true, pax:true, inform:true};
function assign(){
  if(state!=='deciding' || !selCand) return;
  opts = {tow:$('#optTow').checked, pax:$('#optPax').checked, inform:$('#optInform').checked};
  const btn = $('[data-act="assign"]'); btn.disabled = true; btn.innerHTML = `${ic('loader','spin')}Отправляем команду…`;
  btn.querySelector('svg').style.animation = 'spin 1s linear infinite';
  setTimeout(()=>{
    lastReaction = (Date.now()-incident.t0)/1000;
    incident.assignedAt = Date.now();
    const c = selCand;
    resMarkers[c.id] && L_.res.removeLayer(resMarkers[c.id]);
    const path = candPath(c);
    buses[c.id] = {id:c.id, route:'10', phase:incident.d, dev:0, plate:c.plate, model:c.model, cap:c.cap, driver:c.driver, pax:0, moving:false, state:'moving'};
    const m = L.marker(path[0],{icon:busIcon(buses[c.id]), zIndexOffset:1000}).addTo(L_.buses); m._key=iconKey(buses[c.id]); m.on('click', ()=>openBusPopup(buses[c.id])); busMarkers[c.id]=m;
    const cum=[0]; for(let i=1;i<path.length;i++) cum.push(cum[i-1]+hav(path[i-1],path[i]));
    assignAnim = {path, cum, len:cum[cum.length-1], dur:c.eta*60/DEMO_ACCEL, t0:performance.now(), progress:0, leftReal:c.eta*60};
    pushFeed({lvl:'brand', title:`Борт ${c.id} назначен на М10`, sub:`Прибытие к ${hhmm(new Date(Date.now()+c.eta*60000))} · решение за ${mmss(lastReaction)}`});
    if(opts.tow) pushFeed({lvl:'brand', title:'Техпомощь вызвана к борту 1047', sub:`${addr(incident)} · ориентировочно 25 мин`});
    setState('assigned'); drawFx(); renderDone();
    clearTimeout(undoTimer); let u=10; const tick=()=>{ const b=$('[data-act="undo"]'); if(b){ b.innerHTML = `${ic('reset')}Отменить · ${u} с`; } if(u--<=0){ b && b.remove(); return; } undoTimer=setTimeout(tick,1000); }; tick();
    setTimeout(()=>{ if(state==='assigned'){ incident.ack = new Date(); renderDone(); pushFeed({lvl:'ok', title:`Водитель борта ${c.id} подтвердил`, sub:'Следует к месту поломки'}); } }, 2600);
  }, 700);
}

      ${step(pr>=1?'is-done':ack?'is-run':'', pr>=1?'check':'nav', 'Следует к месту поломки', `${(c.dist/1000).toFixed(1).replace('.',',')} км · осталось <span class="num" data-eta>${assignAnim?mmss(assignAnim.leftReal):''}</span>`, '', `<div class="bar"><i data-bar style="width:${Math.round(pr*100)}%"></i></div>`)}
      ${step(pr>=1?'is-done':'', pr>=1?'check':'users', opts.pax?`Подбор пассажиров у ост. «${inc.stop.name}»`:`Вход в рейс с ост. «${inc.stop.name}»`, 'Далее по графику рейса борта 1047', '')}
      ${opts.tow?step('is-done','tow','Техпомощь вызвана','Эвакуатор ПАТП № 2 · ~25 мин', hhmmss(new Date(inc.assignedAt))):''}
      ${opts.inform?step('is-done','speaker','Пассажиры оповещены', `Табло на ${routes['10'].stops.filter(s=>s.d>inc.d).slice(0,4).length} остановках и приложение «Транспорт Рязани»`, hhmmss(new Date(inc.assignedAt))):''}
    </ol></section>
  </div>
  <div class="dz-foot">

    <button class="btn btn-primary btn-lg" data-act="done" data-primary>К карте</button>
  </div>`;

function undoAssign(){
  if(state!=='assigned') return;
  clearTimeout(undoTimer);
  const c = selCand; L_.buses.removeLayer(busMarkers[c.id]); delete busMarkers[c.id]; delete buses[c.id]; assignAnim=null;
  resMarkers[c.id] && resMarkers[c.id].addTo(L_.res);
  feed = feed.filter(e=>!e.title.includes(`${c.id} назначен`) && !e.title.startsWith('Техпомощь') && !e.title.startsWith('Водитель борта'));
  pushFeed({lvl:'warn', title:`Назначение борта ${c.id} отменено`, sub:'Инцидент снова ждёт решения'});
  setState('deciding'); renderDecision(); drawFx(); toast('Назначение отменено');
}
function resolveIncident(){
  const c = selCand; const nb = buses[c.id];
  nb.state='line'; nb.moving=true; nb.phase=incident.d; nb.pax = incident.bus.pax;
  incident.bus.state='off';
  pushFeed({lvl:'ok', title:`М10 · Борт ${c.id} вышел на линию`, sub:`Пассажиры борта 1047 подобраны · интервал ${incident.plan} мин`});
  pushFeed({lvl:'ok', title:'Инцидент № 2417 закрыт', sub:`Реакция диспетчера ${mmss(lastReaction)} · замена прибыла через ${c.eta} мин`});
  reserves = reserves.filter(r=>r.id!==c.id);
  assignAnim = null;
  const d=$('#drawer'); d.classList.remove('is-open'); d.setAttribute('aria-hidden','true'); $('#app').classList.remove('drawer-open');
  setState('resolved'); drawFx();
  toast(`${ic('check')} Маршрут 10 работает в штатном режиме`);
}

/* ================= main loop ================= */
let lastT = performance.now(), lastUi = 0;
function loop(t){
  const dt = Math.min(.1, (t-lastT)/1000); lastT = t;
  Object.values(buses).forEach(b=>{
    if(!(b.state==='line' && b.moving)) return;
    const L2 = 2*routes[b.route].path.len; b.phase = (b.phase + SPEED*dt) % L2;
    busMarkers[b.id] && busMarkers[b.id].setLatLng(busPos(b).ll);
  });
  if(assignAnim){
    const a = assignAnim; const k = clamp((t-a.t0)/1000/a.dur,0,1); a.progress=k; a.leftReal = (1-k)*selCand.eta*60;
    const d = a.len*k; let i=0; while(i<a.cum.length-2 && a.cum[i+1]<d) i++;
    const f = (d-a.cum[i])/((a.cum[i+1]-a.cum[i])||1); const p=a.path[i], q=a.path[i+1];
    busMarkers[selCand.id].setLatLng([p[0]+(q[0]-p[0])*f, p[1]+(q[1]-p[1])*f]);
    if(k>=1){ resolveIncident(); }
  }
  if(t-lastUi > 1000){ lastUi = t; uiTick(); }
  requestAnimationFrame(loop);
}
function uiTick(){
  const now = new Date();
  $('#clock').innerHTML = `${hhmm(now)}<span class="dim">:${pad(now.getSeconds())}</span>`;
  $('#dateLine').textContent = now.toLocaleDateString('ru-RU',{weekday:'short', day:'numeric', month:'long'});
  if(incident && (state==='incident'||state==='deciding')) $$('[data-since]').forEach(el=> el.textContent = mmss((Date.now()-incident.t0)/1000));
  if(assignAnim){ $$('[data-eta]').forEach(el=> el.textContent = mmss(assignAnim.leftReal)); $$('[data-bar]').forEach(el=> el.style.width = Math.round(assignAnim.progress*100)+'%'); }
  Object.values(buses).forEach(b=>{ if(b.state==='line' && !b.fixedDev) b.dev = clamp(b.dev + (Math.random()-.5)*6, -110, 110); });
}

document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' && e.target.type==='text'){ if(e.key==='Escape') e.target.blur(); return; }
  if(e.key==='/' ){ e.preventDefault(); $('#search').focus(); return; }
  if((e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К') && !e.ctrlKey && !e.metaKey && !e.altKey){ resetScenario(); return; }
  if(e.key==='Escape'){ if($('#drawer').classList.contains('is-open')) closeDrawer(); else if(selRoute) selectRoute(selRoute); return; }
  if(e.key==='Enter'){
    if(e.target.closest && e.target.closest('button') && !e.target.closest('[data-primary]')) return;
    if(state==='incident'){ e.preventDefault(); openDecision(); }
    else if(state==='deciding'){ e.preventDefault(); assign(); }
    else if(state==='assigned' && $('#drawer').classList.contains('is-open')){ e.preventDefault(); closeDrawer(); }
    return;
  }
  if(state==='deciding' && /^[1-4]$/.test(e.key)){ const c = cands()[+e.key-1]; c && selectCand(c.id); }
});

/* ---------- Маршруты и расписания ---------- */
function routeStats(r){
  const bs = Object.values(buses).filter(b=>b.route===r.id && b.state!=='off');
  const sts = bs.map(b=> b.state==='moving' ? 'ok' : busStatus(b));
  const worst = sts.includes('crit') ? 'crit' : sts.includes('late') ? 'late' : sts.includes('warn') ? 'warn' : 'ok';
  const plan = DEFS().find(d=>d.id===r.id).buses.length;
  const active = bs.filter(b=>b.state==='line').length;
  const ivPlan = Math.round(r.cycleMin/plan), ivFact = Math.round(r.cycleMin/Math.max(1,active));
  const reg = Math.round(sts.filter(x=>x==='ok').length/Math.max(1,sts.length)*100);
  const first = sv('f'+r.id, R=>tm(5, 20+Math.floor(R()*35))), last = sv('l'+r.id, R=>tm(22, 30+Math.floor(R()*29)));
  return {bs, worst, plan, active, ivPlan, ivFact, reg, first, last};
}

/* ---------- Аналитика ---------- */
function chartW(el){ return Math.max(260, Math.round(el.getBoundingClientRect().width) - 40); }
function regSeries(){
  // регулярность по получасам за последние 12 часов; последний пункт — текущее значение на карте
  const n = 24, now = new Date(); const end = new Date(now); end.setMinutes(now.getMinutes() < 30 ? 0 : 30, 0, 0);
  const R = rng(17); let v = 93.5;
  const c = counts(); const onLine = c.total - c.crit - c.moving; const cur = Math.round(c.ok/Math.max(1,onLine)*1000)/10;
  const out = Array.from({length:n}, (_,i)=>{ v = clamp(v + (R()-.5)*3 + (93.5-v)*0.18, 86, 98); const d = new Date(end.getTime() - (n-1-i)*1800000); return {t:hhmm(d), v:Math.round(v*10)/10}; });
  out[out.length-1].v = cur; return out;
}
function lineChart(data, W){
  const H = 220, l = 36, r = 12, t = 14, b = 28, lo = 80, hi = 100, target = 92;
  const X = i => l + (W-l-r)*i/Math.max(1,data.length-1), Y = v => t + (H-t-b)*(1-(v-lo)/(hi-lo));
  const pts = data.map((d,i)=>[X(i),Y(d.v)]);
  const path = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  let g = '';
  for(let v=lo; v<=hi; v+=5) g += `<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" class="c-grid"/><text x="${l-8}" y="${Y(v)+4}" text-anchor="end" class="c-ax">${v}</text>`;
  data.forEach((d,i)=>{ if(i%4===0) g += `<text x="${X(i)}" y="${H-8}" text-anchor="middle" class="c-ax">${d.t}</text>`; });
  g += `<line x1="${l}" x2="${W-r}" y1="${Y(target)}" y2="${Y(target)}" class="c-target"/><text x="${W-r}" y="${Y(target)-6}" text-anchor="end" class="c-ax c-target-l">норматив ${target} %</text>`;
  const last = pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Регулярность по получасам за смену">
    ${g}<path d="${path} L${last[0]} ${Y(lo)} L${pts[0][0]} ${Y(lo)}Z" class="c-area"/><path d="${path}" class="c-line"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" class="c-dot"/>
    <line class="c-cross" x1="0" x2="0" y1="${t}" y2="${H-b}" visibility="hidden"/><circle class="c-hov" r="5" visibility="hidden"/>
    <rect class="c-hit" x="${l}" y="${t}" width="${W-l-r}" height="${H-t-b}" fill="transparent" data-line='${JSON.stringify(data.map((d,i)=>[d.t,d.v,X(i),Y(d.v)]))}'/>
  </svg>`;
}
function delaysData(){
  return Object.values(routes).map(r=>{
    const s = routeStats(r);
    const nowLate = s.bs.filter(b=>b.state==='line' && busStatus(b)!=='ok').length;
    const n = sv('dl'+r.id, R=>Math.floor(R()*6)) + nowLate*3 + (s.worst==='crit'?4:0);
    const avg = sv('da'+r.id, R=>2+Math.round(R()*40)/10);
    return {id:r.id, name:r.name, n, avg};
  }).sort((a,b)=>b.n-a.n);
}

/* подсказки: столбцы и график */
const tt = $('#tt');
function showTT(x, y, html){ tt.innerHTML = html; tt.hidden = false; const w = tt.offsetWidth, h = tt.offsetHeight; tt.style.left = clamp(x - w/2, 8, innerWidth - w - 8) + 'px'; tt.style.top = Math.max(8, y - h - 12) + 'px'; }
$('#view').addEventListener('pointermove', e=>{
  const hit = e.target.closest('.c-hit');
  const svg = hit && hit.ownerSVGElement;
  if(hit){
    const pts = JSON.parse(hit.dataset.line); const box = svg.getBoundingClientRect(); const sx = svg.viewBox.baseVal.width/box.width;
    const mx = (e.clientX - box.left)*sx; let k = 0; pts.forEach((p,i)=>{ if(Math.abs(p[2]-mx) < Math.abs(pts[k][2]-mx)) k = i; });
    const p = pts[k]; const cr = svg.querySelector('.c-cross'), hv = svg.querySelector('.c-hov');
    cr.setAttribute('x1',p[2]); cr.setAttribute('x2',p[2]); cr.setAttribute('visibility','visible'); hv.setAttribute('cx',p[2]); hv.setAttribute('cy',p[3]); hv.setAttribute('visibility','visible');
    showTT(box.left + p[2]/sx, box.top + p[3]/sx, `<b class="num">${p[0]}</b> · регулярность <b class="num">${String(p[1]).replace('.',',')} %</b>`); return;
  }
  $$('#view .c-cross, #view .c-hov').forEach(n=>n.setAttribute('visibility','hidden'));
  const it = e.target.closest('[data-tt]');
  if(it){ const r = it.getBoundingClientRect(); showTT(r.left + r.width/2, r.top, esc(it.dataset.tt)); } else tt.hidden = true;
});
$('#view').addEventListener('pointerleave', ()=>{ tt.hidden = true; });

function isMobile(){ return matchMedia('(max-width:900px)').matches; }
const SHEETS = ['peek','half','full'];
function setSheet(st){ $('#side').dataset.sheet = st; }
let sDrag = null, sMoved = false;
const handle = $('#sheetHandle');
handle.addEventListener('click', ()=>{ if(sMoved) return; const cur = $('#side').dataset.sheet; setSheet(SHEETS[(SHEETS.indexOf(cur)+1) % SHEETS.length]); });
handle.addEventListener('pointerdown', e=>{ if(!isMobile()) return; const side = $('#side'); sDrag = {y:e.clientY, h:side.getBoundingClientRect().height}; sMoved = false; side.classList.add('is-drag'); handle.setPointerCapture(e.pointerId); });
handle.addEventListener('pointermove', e=>{ if(!sDrag) return; const dy = sDrag.y - e.clientY; if(Math.abs(dy) > 5) sMoved = true; $('#side').style.height = clamp(sDrag.h + dy, 120, innerHeight - 80) + 'px'; });
const endDrag = ()=>{ if(!sDrag) return; const side = $('#side'); const h = side.getBoundingClientRect().height; side.style.height = ''; side.classList.remove('is-drag'); sDrag = null;
  if(sMoved){ const H = innerHeight; setSheet(h < H*0.3 ? 'peek' : h < H*0.68 ? 'half' : 'full'); } setTimeout(()=>{ sMoved = false; }, 0); };
handle.addEventListener('pointerup', endDrag); handle.addEventListener('pointercancel', endDrag);
// вкладки в свёрнутой шторке раскрывают её; выбор маршрута и «Показать» сворачивают, чтобы была видна карта
$$('.side .tab').forEach(t=>t.addEventListener('click', ()=>{ if(isMobile() && $('#side').dataset.sheet==='peek') setSheet('half'); }));
$('#rlist').addEventListener('click', ()=>{ if(isMobile()) setSheet('peek'); });
$('#feedTop').addEventListener('click', e=>{ if(isMobile() && e.target.closest('[data-act="show"]')) setSheet('peek'); });
// профиль: тема, звук, помощь
function syncMe(){ $('#meThemeSw').classList.toggle('on', isDark()); $('#meSoundSw').classList.toggle('on', soundOn); $('#meShift').textContent = $('#shiftLine').textContent; }
function openMe(on){ $('#meBg').hidden = !on; $('#meBtn').setAttribute('aria-expanded', on); if(on) syncMe(); }
$('#meBtn').addEventListener('click', ()=>openMe(true));
$('#meBg').addEventListener('click', e=>{
  if(e.target.id==='meBg'){ openMe(false); return; }
  const b = e.target.closest('[data-me]'); if(!b) return;
  const k = b.dataset.me;
  if(k==='theme') $('#themeBtn').click();
  if(k==='sound') $('#soundBtn').click();
  if(k==='help'){ openMe(false); setView('help'); return; }
  if(k==='close'){ openMe(false); return; }
  syncMe();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#meBg').hidden){ openMe(false); e.stopPropagation(); } }, true);
// при смене раздела на телефоне карточка деталей закрывается — открывается список
const _setView = setView;
setView = function(v){ if(isMobile()){ $('#view').classList.remove('has-detail'); if(VS[v]) VS[v].sel = null; } _setView(v); if(v==='map' && isMobile()) setTimeout(()=>map.invalidateSize(), 60); };
$$('[data-view]').forEach(b=>{ const nb = b.cloneNode(true); b.replaceWith(nb); nb.addEventListener('click', ()=>setView(nb.dataset.view)); });
window.addEventListener('resize', ()=>{ clearTimeout(window.__mvT); window.__mvT = setTimeout(()=>{ map.invalidateSize(); placeLegend(); }, 200); });
window.setView = (v)=>setView(v);
loadYandex();
window.addEventListener('resize', ()=> map.invalidateSize());
})();
</script>
</body>
