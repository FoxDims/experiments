/* ================= incident ================= */
function intervalsFor(withBroken){
  const r = routes['10']; const L2 = 2*r.path.len;
  const list = Object.values(buses).filter(b=>b.route==='10' && (b.state==='line' || (withBroken && b.id==='1047')));
  const ph = list.map(b=>({id:b.id, p:b.phase})).sort((a,b)=>a.p-b.p);
  return ph.map((x,i)=>{ const nx = ph[(i+1)%ph.length]; const gap = ((nx.p - x.p) + L2) % L2 || L2; return {from:x.id, to:nx.id, min: gap/L2*r.cycleMin}; });
}
const addr = inc => inc.street ? `${inc.street}, у ост. «${inc.stop.name}»` : `Ост. «${inc.stop.name}»`;
const dirTo = () => { const st = routes['10'].stops; return st[st.length-1].name; };
function reverseStreet(){
  if(!ymOK || !incident) return;
  const inc = incident;
  streetAt(inc.ll).then(name=>{
    if(!name || incident!==inc) return;
    inc.street = name; renderAlert(); renderFeed();
    if(state==='deciding') renderDecision(); else if(state==='assigned') renderDone();
  }).catch(()=>{});
}
function triggerIncident(){
  if(state!=='idle') return;
  clearInterval(countdownTimer);
  const b = buses['1047']; const r = routes['10'];
  b.phase = incD; b.state='broken'; b.moving=false;
  const p = busPos(b);
  busMarkers['1047'].setLatLng(p.ll);
  const stop = nearestStop('10', p.d);
  const before = intervalsFor(true); const after = intervalsFor(false);
  const plan = before.reduce((a,x)=>a+x.min,0)/before.length;
  const gap = Math.max(...after.map(x=>x.min));
  incident = {id:2417, bus:b, ll:p.ll, d:p.d, street:p.st, stop, t0:Date.now(), plan:Math.round(plan), gapMin:Math.round(gap)};
  const feedItem = {lvl:'crit', title:'М10 · Борт 1047: поломка на линии', get sub(){ return addr(incident||{stop, street:p.st}); }};
  pushFeed(feedItem); reverseStreet();
  setState('incident');
  drawFx(); routeCandidates();
  beep(); clearInterval(beepTimer); beepTimer = setInterval(()=>{ if(state==='incident') beep(); }, 7000);
}
function focusIncident(){ map.flyTo(incident.ll, 15, {duration:.7}); setTimeout(()=>openBusPopup(incident.bus), 750); }
function drawFx(){
  L_.fx.clearLayers();
  if(!incident || !['incident','deciding','assigned'].includes(state)) return;
  if(state!=='assigned') L.marker(incident.ll,{icon:L.divIcon({className:'', html:'<div class="pulse"><i></i><i></i><i></i></div>', iconSize:[120,120], iconAnchor:[60,60]}), pane:'pulse', interactive:false}).addTo(L_.fx);
  if(state==='deciding' || state==='assigned'){
    const brand=cssVar('--brand'), muted=cssVar('--m-route');
    cands().forEach(c=>{
      const sel = selCand && selCand.id===c.id; if(state==='assigned' && !sel) return;
      const path = candPath(c);
      L.polyline(path,{pane:'routes', color: sel?brand:muted, weight: sel?4:2.5, opacity: c.kind==='break'?.4:1, dashArray: sel?'1 8':'2 7', lineCap:'round', interactive:false}).addTo(L_.fx);
      if(state==='deciding'){
        const mid = path[Math.floor(path.length/2)];

function candPath(c){ if(candRoutes[c.id]) return candRoutes[c.id].lls; const a=c.ll, b=incident.ll; return [a, [a[0]*.5+b[0]*.5, a[1]*.35+b[1]*.65], b]; }

/* candidates */
function cands(){
  return reserves.map(r=>{
    const real = candRoutes[r.id];
    const dist = real ? real.len : hav(r.ll, incident.ll)*1.35;
    const eta = Math.max(2, Math.round((real ? real.sec/60 : dist/1000/22*60) + r.prep));
    const penalty = r.kind==='busy'?6 : r.kind==='depot'?2 : r.kind==='break'?99 : 0;
    const capPen = r.cap < incident.bus.cap ? 3 : 0;
    return {...r, dist, eta, score: eta + penalty + capPen};
  }).sort((a,b)=>a.score-b.score);
}

function stripSVG(){
  const r = routes['10']; const W=matchMedia('(max-width:1440px)').matches ? 300 : 340, H=112, x0=8, x1=W-8, y=54; /* lite: схема рисуется в реальную ширину окна (≈340 px), без масштабирования */ const X = d => x0 + (x1-x0)*d/r.path.len;

  s += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="var(--line-strong)" stroke-width="3" stroke-linecap="round"/>`;

      s += `<text x="${isInc && anchor==='end' ? x+6 : x}" y="${y+34}" text-anchor="${anchor}" font-size="12.5" font-weight="${isInc?600:400}" fill="${isInc?'var(--crit)':'var(--text-3)'}" font-family="var(--f-ui)">${isInc?'ост. «'+st.name+'»':st.name}</text>`;

    const p = busPos(b); const x = X(p.d); const yy = p.fwd ? y-19 : y+15;
    if(b.state==='broken'){ s += `<g transform="translate(${x},${y-22})"><rect x="-21" y="-11" width="42" height="22" rx="6" fill="var(--crit-dot)"/><text x="0" y="4.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff" font-family="var(--f-num)">1047</text></g><line x1="${x}" y1="${y-11}" x2="${x}" y2="${y}" stroke="var(--crit-dot)" stroke-width="1.5"/>`; return; }

  s += `<text x="${x0}" y="${H-2}" font-size="12" fill="var(--text-3)" font-family="var(--f-ui)">◂ обратное направление</text>`;
  return s + '</svg>';
}

/* ================= main loop ================= */
let lastT = performance.now(), lastUi = 0;
function loop(t){
  const dt = Math.min(.1, (t-lastT)/1000); lastT = t;
  Object.values(buses).forEach(b=>{
    if(!(b.state==='line' && b.moving)) return;
    const L2 = 2*routes[b.route].path.len; b.phase = (b.phase + SPEED*dt) % L2;
    busMarkers[b.id] && busMarkers[b.id].setLatLng(busPos(b).ll);
  });
  if(assignAnim){
    const a = assignAnim; const k = clamp((t-a.t0)/1000/a.dur,0,1); a.progress=k; a.leftReal = (1-k)*selCand.eta*60;
    const d = a.len*k; let i=0; while(i<a.cum.length-2 && a.cum[i+1]<d) i++;
    const f = (d-a.cum[i])/((a.cum[i+1]-a.cum[i])||1); const p=a.path[i], q=a.path[i+1];
    busMarkers[selCand.id].setLatLng([p[0]+(q[0]-p[0])*f, p[1]+(q[1]-p[1])*f]);
    if(k>=1){ resolveIncident(); }
  }
  if(t-lastUi > 1000){ lastUi = t; uiTick(); }
  requestAnimationFrame(loop);
}
function uiTick(){
  const now = new Date();
  $('#clock').innerHTML = `${hhmm(now)}<span class="dim">:${pad(now.getSeconds())}</span>`;
  $('#dateLine').textContent = now.toLocaleDateString('ru-RU',{weekday:'short', day:'numeric', month:'long'});
  if(incident && (state==='incident'||state==='deciding')) $$('[data-since]').forEach(el=> el.textContent = mmss((Date.now()-incident.t0)/1000));
  if(assignAnim){ $$('[data-eta]').forEach(el=> el.textContent = mmss(assignAnim.leftReal)); $$('[data-bar]').forEach(el=> el.style.width = Math.round(assignAnim.progress*100)+'%'); }
  Object.values(buses).forEach(b=>{ if(b.state==='line' && !b.fixedDev) b.dev = clamp(b.dev + (Math.random()-.5)*6, -110, 110); });
}

  incident=null; selCand=null; assignAnim=null; lastReaction=null; selRoute=null; $('#routeFilter').hidden=true;
  candRoutes = {}; rebuildFleet(); relocateReserves(); drawReserves(); createBusMarkers(); seedFeed();

}

/* ================= keyboard ================= */
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' && e.target.type==='text'){ if(e.key==='Escape') e.target.blur(); return; }
  if(!$('#ux').hidden){ if(e.key==='Escape') closeUX(); return; }
  if(e.key==='/' ){ e.preventDefault(); $('#search').focus(); return; }
  if((e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К') && !e.ctrlKey && !e.metaKey && !e.altKey){ resetScenario(); return; }
  if(e.key==='Escape'){ if($('#drawer').classList.contains('is-open')) closeDrawer(); else if(selRoute) selectRoute(selRoute); return; }
  if(e.key==='Enter'){
    if(e.target.closest && e.target.closest('button') && !e.target.closest('[data-primary]')) return;
    if(state==='incident'){ e.preventDefault(); openDecision(); }
    else if(state==='deciding'){ e.preventDefault(); assign(); }
    else if(state==='assigned' && $('#drawer').classList.contains('is-open')){ e.preventDefault(); closeDrawer(); }
    return;
  }
  if(state==='deciding' && /^[1-4]$/.test(e.key)){ const c = cands()[+e.key-1]; c && selectCand(c.id); }
});

/* search: filter by bus or route */
$('#search').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return; const q = e.target.value.trim().replace(/^м/i,'');
  if(buses[q]){ map.flyTo(busMarkers[q].getLatLng(), 15, {duration:.6}); setTimeout(()=>openBusPopup(buses[q]),650); e.target.blur(); return; }
  if(routes[q]){ selectRoute(q); e.target.blur(); return; }
  const st = Object.values(STOPS).find(s=>s[0].toLowerCase().includes(q.toLowerCase()));
  if(st && q){ map.flyTo(st[1], 15.5, {duration:.6}); e.target.blur(); return; }
  toast('Ничего не найдено: попробуйте номер борта (1047) или маршрута (10)');
});
